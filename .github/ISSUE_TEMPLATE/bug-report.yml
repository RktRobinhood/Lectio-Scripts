name: Bug report
description: Something in the latest unmodified Lectio script is not working as intended.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        Please **remove private Lectio information** before submitting. Do not post passwords, cookies, tokens, private messages, grades, attendance data, full Network/HAR exports, or unredacted student information.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      description: These checks make the report much easier to reproduce and triage.
      options:
        - label: I searched the existing Issues for the same problem.
          required: true
        - label: I tested with the latest unmodified version from this repository, or I explain below why I could not.
          required: true
        - label: I removed or redacted private/personal Lectio information.
          required: true

  - type: dropdown
    id: script
    attributes:
      label: Affected script
      options:
        - Chairs Up
        - English Mode
        - Unread Message Notifications
        - More than one script
        - Other / new script
    validations:
      required: true

  - type: input
    id: script-version
    attributes:
      label: Script version
      description: Look for the @version line near the top of the userscript.
      placeholder: "Example: 1.3"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Firefox
        - Google Chrome
        - Microsoft Edge
        - Safari
        - Opera
        - Other
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: "Example: Firefox 154"
    validations:
      required: true

  - type: input
    id: tampermonkey-version
    attributes:
      label: Tampermonkey version
      placeholder: "Example: 5.x"
    validations:
      required: true

  - type: input
    id: school-id
    attributes:
      label: Lectio school ID
      description: Optional. This is the number in a URL such as /lectio/223/. Do not include a personal/student ID.
      placeholder: "Example: 223"

  - type: input
    id: page
    attributes:
      label: Lectio page / area
      description: Give the page type rather than a URL containing personal identifiers.
      placeholder: "Example: timetable / messages / activity page"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Explain exactly what someone else should do to trigger the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Change ...
        4. The problem appears ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      placeholder: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: isolated
    attributes:
      label: Does it still happen with other Lectio userscripts disabled?
      options:
        - "Yes"
        - "No"
        - Not tested
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Relevant Console output
      description: Paste only relevant, redacted Console errors. See the README for instructions. Do not paste Network/HAR data or authentication information.
      placeholder: Paste relevant redacted errors here.
      render: text

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Upload a redacted screenshot if it helps explain the problem.

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Include extension conflicts, temporary workarounds, or anything else that may help reproduce the issue.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked this report and its attachments for student data, private messages, grades, passwords, cookies, tokens, and other sensitive information.
          required: true
