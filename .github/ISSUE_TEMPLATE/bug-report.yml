name: Bug report
description: Something in the latest unmodified Lectio script is not working as intended.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        Please **remove private Lectio information** before submitting. Do not post passwords, cookies, tokens, private messages, grades, attendance data, full Network/HAR exports, or unredacted student information.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      description: These checks make the report much easier to reproduce and triage.
      options:
        - label: I searched the existing Issues for the same problem.
          required: true
        - label: I tested with the latest unmodified version from this repository, or I explain below why I could not.
          required: true
        - label: I removed or redacted private/personal Lectio information.
          required: true

  - type: dropdown
    id: script
    attributes:
      label: Affected script
      description: Pick the name as it appears on the module's card in the Lectio Manager.
      options:
        - Chairs Up
        - English Mode
        - Unread Message Notifications
        - Lectio Theming
        - Subject Colours
        - Schedule Summary
        - Lectio Change Radar
        - Lectio Manager
        - More than one script
        - Other / new script
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: Release channel
      description: The Manager's settings show this as "Release channel". Pick "Not sure" if you have never changed it.
      options:
        - Stable
        - Experimental
        - Not sure
    validations:
      required: true

  - type: input
    id: script-version
    attributes:
      label: Script version
      description: Open the Lectio Manager — each installed module's version is shown on its card. If you installed without the Manager, use the @version line near the top of the userscript instead.
      placeholder: "Example: 0.18.0"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Firefox
        - Google Chrome
        - Microsoft Edge
        - Safari
        - Opera
        - Other
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: "Example: Firefox 154"
    validations:
      required: true

  - type: input
    id: tampermonkey-version
    attributes:
      label: Tampermonkey version
      placeholder: "Example: 5.x"
    validations:
      required: true

  - type: input
    id: school-id
    attributes:
      label: Lectio school ID
      description: Optional. This is the number in a URL such as /lectio/223/. Do not include a personal/student ID.
      placeholder: "Example: 223"

  - type: input
    id: page
    attributes:
      label: Lectio page / area
      description: Give the page type rather than a URL containing personal identifiers.
      placeholder: "Example: timetable / front page / the Manager's settings panel"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Explain exactly what someone else should do to trigger the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Change ...
        4. The problem appears ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: "Example: the colour key should list every class currently on screen."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      placeholder: "Example: the key stays empty and the lessons keep Lectio's own colours."
    validations:
      required: true

  - type: dropdown
    id: isolated
    attributes:
      label: Does it still happen with other Lectio userscripts disabled?
      options:
        - "Yes"
        - "No"
        - Not tested
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Relevant Console output
      description: Paste only relevant, redacted Console errors. See the README for instructions. Do not paste Network/HAR data or authentication information.
      placeholder: Paste relevant redacted errors here.
      render: text

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Upload a redacted screenshot if it helps explain the problem.

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Include extension conflicts, temporary workarounds, or anything else that may help reproduce the issue.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked this report and its attachments for student data, private messages, grades, passwords, cookies, tokens, and other sensitive information.
          required: true
