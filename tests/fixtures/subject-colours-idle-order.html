<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <title>Lectio Subject Colours idle-injection fixture</title>
    <script>
        /*
         * Tampermonkey injects the Manager and every module at document-idle,
         * one after another, in an order nothing controls. Each script's boot
         * block then runs its start function during the file's own
         * evaluation, and the Manager's init() fires its one start-up
         * lectio-manager:discover right there - so a module evaluated after
         * the Manager has no listener attached when it goes out, and never
         * hears it.
         *
         * subject-colours.html cannot see that: it loads the module with a
         * <script> tag in the body, while the document is still parsing, and
         * plays the Manager with a hand-fired Discovery after load. This
         * fixture adds the real Manager and the real module after `load`, the
         * way Tampermonkey does, in the order the query string names, and
         * asserts that the Automatic colour key lands in the dock either way
         * (issue #67). `stored` is the colour key location a previous page
         * view left behind, so a reload after the person chose the dock or
         * the floating key is one more run of this same page.
         */
        const params = new URLSearchParams(location.search);
        const order = params.get('order') || 'manager-first';
        const stored = params.get('stored') || '';

        const catalogue = {
            schemaVersion: 1,
            generatedAt: '2026-09-20T00:00:00.000Z',
            modules: [{
                id: 'subject-colours',
                name: 'Subject Colours',
                version: '0.4.0',
                description: 'Test colours',
                status: 'unstable',
                installUrl: 'https://raw.githubusercontent.com/RktRobinhood/Lectio-Scripts/main/modules/Lectio-Subject-Colours.user.js'
            }]
        };
        const storage = new Map([
            ['lectioManager.catalogue.v1', JSON.stringify(catalogue)],
            ['lectioManager.lastRefresh.v1', Date.now()],
            ['lectioManager.updateTipDismissed.v1', true]
        ]);

        window.GM_getValue = (key, fallback) => storage.has(key) ? storage.get(key) : fallback;
        window.GM_setValue = (key, value) => storage.set(key, value);
        window.GM_xmlhttpRequest = () => {};
        window.fetch = async (url) => ({
            ok: true,
            status: 200,
            url: String(url),
            text: async () => '<!doctype html><html><body></body></html>'
        });

        localStorage.clear();

        // The colour key is off by default, so a settings record is always
        // present here; the location in it is 'auto' unless a previous page
        // view stored a choice. Background scanning is off so the module
        // asks the Manager for nothing else.
        window.settingsKey = 'lectioSubjectColours.settings.v1';
        localStorage.setItem(window.settingsKey, JSON.stringify({
            schema: 2,
            enabled: true,
            style: 'fill',
            intensity: 100,
            regularity: 'balanced',
            scanWeeks: 0,
            colourOther: true,
            showLegend: true,
            legendLocation: stored || 'auto',
            patternMarkers: false,
            patternScale: 100,
            lockColours: false,
            lockedTheme: null,
            overrides: {}
        }));

        // The module's own ISO week stamp, so the learned weeks below line up
        // with the week it derives for this page's blocks.
        const isoWeekOf = (date) => {
            const point = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const day = point.getUTCDay() || 7;
            point.setUTCDate(point.getUTCDate() + 4 - day);
            const yearStart = new Date(Date.UTC(point.getUTCFullYear(), 0, 1));
            const week = Math.ceil(((point - yearStart) / 86400000 + 1) / 7);
            return `${String(week).padStart(2, '0')}${point.getUTCFullYear()}`;
        };
        const today = new Date();
        const daysAgo = (days) => new Date(today.getFullYear(), today.getMonth(), today.getDate() - days);

        // Two classes already learned over the two previous weeks, so the
        // blocks on this page are classified as classes on load and the key
        // has something to list. Served from /lectio/223/, so the store is
        // scoped to school 223.
        const learnedEntry = (id, name) => ({
            label: name,
            hold: true,
            ids: [id],
            names: [name],
            weekCounts: { [isoWeekOf(daysAgo(7))]: 2, [isoWeekOf(daysAgo(14))]: 2 },
            lastSeen: Date.now()
        });
        localStorage.setItem('lectioSubjectColours.schedule.v1.223', JSON.stringify({
            scannedAt: Date.now(),
            weeks: {},
            slots: { 'h:HE111': 0, 'h:HE222': 1 },
            otherSlots: {},
            entries: {
                'h:HE111': learnedEntry('HE111', '1i Psyc HL'),
                'h:HE222': learnedEntry('HE222', '2b Mat A')
            },
            aliases: {}
        }));

        window.bootErrors = [];
        window.addEventListener('error', (event) => window.bootErrors.push(String(event.message)));

        window.registrations = new Map();
        window.addEventListener('lectio-module:register', (event) => {
            window.registrations.set(event.detail.id, event.detail);
        });

        // How many Discoveries had already gone out when the module's script
        // was added. This is what makes the manager-first run a real
        // reproduction rather than a lucky pass: it must be at least one.
        window.discoveries = 0;
        window.discoveriesBeforeModule = null;
        window.addEventListener('lectio-manager:discover', () => { window.discoveries += 1; });

        const scripts = {
            manager: '/manager/Lectio-Manager.user.js',
            module: '/modules/Lectio-Subject-Colours.user.js'
        };

        function inject(name) {
            return new Promise((resolveLoaded, rejectLoad) => {
                if (name === 'module') window.discoveriesBeforeModule = window.discoveries;
                const script = document.createElement('script');
                script.src = scripts[name];
                script.onload = resolveLoaded;
                script.onerror = () => rejectLoad(new Error(`${scripts[name]} did not load`));
                document.head.appendChild(script);
            });
        }

        window.addEventListener('load', async () => {
            try {
                const sequence = order === 'module-first' ? ['module', 'manager'] : ['manager', 'module'];
                for (const name of sequence) await inject(name);
            } catch (error) {
                window.bootErrors.push(error.message);
            }
            // Past the module's 2.5s Manager grace window, so a key that was
            // going to fall back to the page has done so by now.
            window.setTimeout(runAssertions, 3500);
        });
    </script>
</head>
<body>
    <main id="masterContent">
        <table id="s_m_Content_Content_SkemaNyMedNavigation_skema_skematabel">
            <tbody id="schedule-body">
                <tr class="s2dayHeader"><td></td><td>Mandag</td><td>Tirsdag</td></tr>
            </tbody>
        </table>
    </main>
    <script>
        // This week's timetable, built before either script is injected, so
        // both see it the way they would see a server-rendered Lectio page.
        (() => {
            const isoDate = (day) =>
                `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, '0')}-${String(day.getDate()).padStart(2, '0')}`;
            const shortDate = (day) => `${day.getDate()}/${day.getMonth() + 1}-${day.getFullYear()}`;

            const rows = [
                { id: 'psyc-1', holdId: 'HE111', holdName: '1i Psyc HL', time: '08:15 til 09:25' },
                { id: 'psyc-2', holdId: 'HE111', holdName: '1i Psyc HL', time: '09:40 til 10:50' },
                { id: 'math-1', holdId: 'HE222', holdName: '2b Mat A', time: '10:00 til 11:10' },
                { id: 'math-2', holdId: 'HE222', holdName: '2b Mat A', time: '11:20 til 12:30' }
            ];

            const body = document.getElementById('schedule-body');
            for (const row of rows) {
                const anchor = document.createElement('a');
                anchor.id = row.id;
                anchor.className = 's2skemabrik s2brik s2normal';
                anchor.setAttribute('data-tooltip', [
                    `${shortDate(today)} ${row.time}`,
                    `Hold: ${row.holdName}`,
                    'Lærer: Matthew Pilley (MP)',
                    'Lokale: 205'
                ].join('\n'));
                const span = document.createElement('span');
                span.setAttribute('data-lectiocontextcard', row.holdId);
                span.textContent = row.holdName;
                anchor.append(document.createTextNode(`${row.time} `), span);

                const tr = document.createElement('tr');
                const label = document.createElement('td');
                const cell = document.createElement('td');
                const container = document.createElement('div');
                label.textContent = row.time;
                cell.setAttribute('data-date', isoDate(today));
                container.className = 's2skemabrikcontainer';
                container.appendChild(anchor);
                cell.appendChild(container);
                tr.append(label, cell);
                body.appendChild(tr);
            }
        })();

        const assert = (condition, message) => {
            if (!condition) throw new Error(message);
        };

        function runAssertions() {
            const result = document.createElement('pre');
            result.id = 'test-result';

            try {
                assert(window.bootErrors.length === 0, `errors during boot: ${window.bootErrors.join(' | ')}`);

                if (order === 'module-first') {
                    assert(window.discoveriesBeforeModule === 0,
                        `Test setup: module-first should see no Discovery before the module (${window.discoveriesBeforeModule})`);
                } else {
                    assert(window.discoveriesBeforeModule >= 1,
                        `Test setup: manager-first should have fired Discovery before the module was added (${window.discoveriesBeforeModule})`);
                }

                // The learned classes are painted, so the key has two entries
                // to show wherever it ends up.
                for (const id of ['psyc-1', 'math-1']) {
                    assert(document.getElementById(id).getAttribute('data-lectio-subject') === 'class',
                        `Test setup: ${id} was not classified as a class`);
                }

                const expectedSetting = stored || 'auto';
                const registration = window.registrations.get('subject-colours');
                assert(registration, 'Subject Colours did not register with the Manager');
                assert(registration.currentValues.legendLocation === expectedSetting,
                    `Colour key location reported to the Manager was ${registration.currentValues.legendLocation}, expected ${expectedSetting}`);

                // The setting a previous page view stored survives this one
                // untouched; what was wrong in #67 was never the stored value.
                const record = JSON.parse(localStorage.getItem(window.settingsKey) || 'null');
                assert(record && record.legendLocation === expectedSetting,
                    `the stored colour key location did not persist across the reload: ${JSON.stringify(record)}`);
                assert(record.schema === 2, 'the stored record lost its schema stamp');

                const floating = document.getElementById('lectio-subject-colours-legend');
                const dockItem = document.querySelector('[data-dock-key="subject-colours:colour-key"]');
                const dock = document.getElementById('lectio-manager-dock-root');
                assert(dock, 'Test setup: the Manager built no dock root');

                if (expectedSetting === 'floating') {
                    // An explicit choice is honoured with the Manager present.
                    assert(floating, 'Always floating did not render the floating colour key');
                    assert(!dockItem, 'Always floating still put an item in the dock');
                } else {
                    assert(!floating,
                        `${order}, ${expectedSetting}: the colour key fell back to floating on a page with the Manager`);
                    assert(dockItem,
                        `${order}, ${expectedSetting}: the colour key did not reach the dock`);
                    assert(!dock.hidden, 'the dock stayed hidden after the colour key registered');

                    // Opening the item hands the module a mount, and the key
                    // it renders there lists the two classes on screen.
                    dockItem.click();
                    const rows = document.querySelectorAll('.lectio-manager-dock-module-content .lectio-subject-colours-legend__row');
                    assert(rows.length === 2, `the dock colour key listed ${rows.length} classes instead of 2`);
                }

                result.dataset.testResult = 'pass';
                result.textContent = 'PASS';
            } catch (error) {
                result.dataset.testResult = 'fail';
                result.textContent = `FAIL: ${error.message}`;
            }

            document.body.appendChild(result);
        }
    </script>
</body>
</html>
