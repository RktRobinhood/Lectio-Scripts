<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <title>Chairs Up back/forward-cache fixture</title>
    <script>
        /* Three room-week requests that never answer on their own. The only
           thing that ever settles one is the module aborting it, so the run
           is driven entirely by the lifecycle events this fixture fires.

           ?phase=restore  - a page frozen for the back/forward cache and then
                             restored: pagehide persisted, pageshow persisted.
           ?phase=terminal - a page genuinely going away: pagehide with
                             persisted false, followed by a persisted pageshow
                             that must not bring it back.

           Both phases fire their pair back-to-back in one task, because that
           is what a real freeze looks like: nothing of this page's own runs
           between pagehide and pageshow. */
        window.PHASE = new URLSearchParams(location.search).get('phase') || 'restore';

        window.fetchLog = [];
        window.frozenAt = -1;

        const persisted = (type) => {
            try {
                return new PageTransitionEvent(type, { persisted: true });
            } catch (_) {
                const event = new Event(type);
                Object.defineProperty(event, 'persisted', { value: true });
                return event;
            }
        };

        window.fetch = (url, init) => {
            const record = {
                url: String(url),
                credentials: init && init.credentials,
                hasSignal: Boolean(init && init.signal),
                startedAt: Date.now(),
                aborted: false,
                abortedAfterMs: -1
            };

            window.fetchLog.push(record);

            /* The freeze lands while the very first room-week request is
               still in flight, so two jobs are still unstarted when it
               happens. Whether those two ever reach the network is the whole
               question this fixture asks. */
            if (window.fetchLog.length === 1) {
                setTimeout(() => {
                    window.frozenAt = Date.now();

                    if (window.PHASE === 'terminal') {
                        /* A real navigation. Nothing may restart after this,
                           not even the persisted pageshow that follows. */
                        window.dispatchEvent(new Event('pagehide'));
                    } else {
                        window.dispatchEvent(persisted('pagehide'));
                    }

                    window.dispatchEvent(persisted('pageshow'));
                }, 100);
            }

            return new Promise((_, reject) => {
                const signal = init && init.signal;

                if (!signal) return;

                signal.addEventListener('abort', () => {
                    record.aborted = true;
                    record.abortedAfterMs = Date.now() - record.startedAt;
                    reject(new DOMException('The user aborted a request.', 'AbortError'));
                });
            });
        };

        /* A room map already harvested and still well inside its ~30 days, so
           the run needs no discovery requests and the only fetches are the
           three room-week refreshes this test is about. */
        window.SEEDED_ROOM_MAP = JSON.stringify({
            '1.05': 'RO123',
            '2.10': 'RO456',
            '3.15': 'RO789'
        });
        window.SEEDED_ROOM_MAP_TIME = String(Date.now());

        localStorage.clear();
        localStorage.setItem('lectioChairsUp.v102.223.roomMap', window.SEEDED_ROOM_MAP);
        localStorage.setItem('lectioChairsUp.v102.223.roomMapTime', window.SEEDED_ROOM_MAP_TIME);
    </script>
</head>
<body>
    <div id="masterContent">
        <table id="timetable"><tr id="lessons"></tr></table>
    </div>

    <script>
        /* Tomorrow, so all three lessons are inside the module's seven-day
           lookahead and none has a room-week cache yet - three refresh jobs,
           one per room, run strictly one at a time. */
        const lessonDate = new Date();
        lessonDate.setDate(lessonDate.getDate() + 1);

        const lectioDate = lessonDate.getDate() + '/' + (lessonDate.getMonth() + 1) +
            '-' + lessonDate.getFullYear();

        const lessons = document.getElementById('lessons');

        for (const [index, [absid, room]] of [
            ['81266224401', '1.05'],
            ['81266224402', '2.10'],
            ['81266224403', '3.15']
        ].entries()) {
            const cell = document.createElement('td');
            const brick = document.createElement('a');

            brick.className = 's2skemabrik s2brik';
            brick.href = '/lectio/223/aktivitet/aktivitetforside2.aspx?absid=' + absid;
            brick.setAttribute('data-brikid', 'ABS' + absid);
            brick.setAttribute('data-tooltip', [
                lectioDate + ' 09:40 til 10:50',
                'Hold: 1i Psyc HL',
                'Laerer: MP',
                'Lokale: ' + room
            ].join('\n'));
            brick.textContent = 'Lektion ' + (index + 1);

            cell.appendChild(brick);
            lessons.appendChild(cell);
        }
    </script>

    <script src="/modules/Lectio-Chairs-Up.user.js"></script>

    <script>
        const failures = [];
        const assert = (condition, message) => {
            if (!condition) failures.push(message);
        };

        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        const waitFor = async (predicate, label) => {
            for (let attempt = 0; attempt < 400; attempt += 1) {
                if (predicate()) return true;
                await wait(50);
            }
            failures.push('timed out waiting for ' + label);
            return false;
        };

        const report = () => {
            const output = document.createElement('pre');
            output.id = 'test-result';
            output.textContent = failures.length ? failures.join(' | ') : 'pass';
            document.body.dataset.testResult = failures.length ? 'fail' : 'pass';
            document.body.appendChild(output);
        };

        (async () => {
            const log = window.fetchLog;

            /* --- The freeze aborts what is in flight, in both phases ------ */

            await waitFor(() => log.length >= 1, 'the first room-week request to start');
            await waitFor(() => log[0] && log[0].aborted, 'the freeze to abort the first request');

            if (log[0]) {
                assert(log[0].hasSignal, 'the first request carried no abort signal');
                assert(
                    log[0].credentials === 'include',
                    'the first request stopped sending the Lectio session cookie'
                );
                assert(
                    /SkemaNy\.aspx\?type=lokale/.test(log[0].url),
                    'the first request was not a room-week request: ' + log[0].url
                );
                /* Aborted by pagehide, not by the module's own eight-second
                   hard timeout - otherwise this would prove nothing about
                   pagehide at all. */
                assert(
                    log[0].abortedAfterMs <= 3000,
                    'pagehide should have aborted the in-flight request at once, took ' +
                        log[0].abortedAfterMs + 'ms'
                );
            }

            if (window.PHASE === 'restore') {
                /* --- A restored page goes back to fetching ---------------- */

                /* Two jobs were still unstarted when the page was frozen. On
                   a module whose gate is never lifted they are skipped in
                   silence, which is issue #41; here they must go through. */
                const resumed = await waitFor(
                    () => log.length >= 3,
                    'the two remaining room-week requests to run after the bfcache restore ' +
                        '(only ' + log.length + ' request(s) ever started)'
                );

                if (resumed) {
                    assert(
                        log[1].startedAt >= window.frozenAt,
                        'the second request started before the page was even frozen'
                    );

                    const rooms = log.map((entry) => (entry.url.match(/id=(RO\d+)/) || [])[1]);

                    assert(
                        rooms.join(',') === 'RO123,RO456,RO789',
                        'the three requests should be the three rooms in order, got: ' +
                            rooms.join(',')
                    );

                    for (const [index, entry] of log.entries()) {
                        assert(entry.hasSignal, 'request ' + index + ' carried no abort signal');
                        assert(
                            entry.credentials === 'include',
                            'request ' + index + ' stopped sending the Lectio session cookie'
                        );
                    }
                }

                /* Nothing was queued up behind the freeze and released all at
                   once: the pass is still one request at a time. */
                assert(
                    log.length === 3,
                    'expected exactly three room-week requests, got ' + log.length
                );
            } else {
                /* --- A page genuinely going away stays aborted ------------- */

                /* The restore phase proves these two jobs do run when the
                   gate is lifted, so their absence here is a real result and
                   not a module that had simply finished its work. The
                   persisted pageshow fired right after the terminal pagehide
                   must not revive them either. */
                await wait(3000);

                assert(
                    log.length === 1,
                    'a terminal pagehide left the module fetching: expected one request, got ' +
                        log.length + ' (' + log.map((entry) => entry.url).join(' , ') + ')'
                );
            }

            /* --- The room-id cache is none of this net's business ---------- */

            assert(
                localStorage.getItem('lectioChairsUp.v102.223.roomMap') === window.SEEDED_ROOM_MAP,
                'the harvested room map was rewritten'
            );
            assert(
                localStorage.getItem('lectioChairsUp.v102.223.roomMapTime') === window.SEEDED_ROOM_MAP_TIME,
                'the room map expiry clock was restarted'
            );

            report();
        })();
    </script>
</body>
</html>
