<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <title>Lectio Manager page-health fixture</title>
</head>
<body>
    <script>
        /*
         * The Manager's page-health sampler (PAGE HEALTH in the Manager, and
         * docs/manager-problem-log.md). Two pages, picked by ?scenario=:
         *
         * - quiet: an ordinary page. Nothing may be logged, however long it
         *   stays open - a sampler that logs a healthy page is noise in the
         *   one place a person goes to find real problems.
         * - busy: a page that has grown huge and is being redrawn non-stop,
         *   which is the shape the Subject Colours 0.11.4 loop had. Both must
         *   be logged, once each, with numbers and no prose - and a second
         *   sample of the same flat values must not log them again.
         *
         * The run is long in virtual time (first sample after 3-4 minutes, the
         * next 15 minutes later), so the test grants a budget that covers both.
         */
        const scenario = new URLSearchParams(location.search).get('scenario') || 'quiet';

        const storage = new Map([
            ['lectioManager.catalogue.v1', JSON.stringify({
                schemaVersion: 1,
                generatedAt: '2026-10-08T00:00:00.000Z',
                modules: [{
                    id: 'alpha',
                    name: 'Alpha',
                    description: 'A stand-in module.',
                    category: 'Interface',
                    audience: ['student'],
                    status: 'stable',
                    version: '1.0.0',
                    installUrl: 'https://raw.githubusercontent.com/RktRobinhood/Lectio-Scripts/main/modules/alpha.user.js',
                    supportUrl: 'https://github.com/RktRobinhood/Lectio-Scripts/issues'
                }]
            })],
            ['lectioManager.lastRefresh.v1', Date.now()],
            ['lectioManager.updateTipDismissed.v1', true]
        ]);

        window.GM_getValue = (key, fallback) => storage.has(key) ? storage.get(key) : fallback;
        window.GM_setValue = (key, value) => storage.set(key, value);
        window.GM_xmlhttpRequest = () => {};

        window.pageErrors = [];
        window.addEventListener('error', (event) => window.pageErrors.push(String(event.message)));

        const storedLog = () => {
            try {
                return JSON.parse(storage.get('lectioManager.log.v1') || '[]');
            } catch (_) {
                return [];
            }
        };

        const wait = (ms) => new Promise((done) => setTimeout(done, ms));

        function assert(condition, message) {
            if (!condition) throw new Error(message);
        }

        function makeBusy() {
            const bulk = document.createElement('div');
            bulk.id = 'bulk';
            for (let index = 0; index < 70000; index += 1) {
                bulk.appendChild(document.createElement('span'));
            }
            document.body.appendChild(bulk);

            // Four attribute writes every 20 ms: 200 changes a second, on a
            // timer rather than an observer loop so virtual time can advance.
            const targets = [...bulk.children].slice(0, 4);
            let flip = 0;
            setInterval(() => {
                flip += 1;
                for (const target of targets) target.dataset.flip = String(flip);
            }, 20);
        }

        async function run() {
            // Past the first sample (3-4 min + the 10 s window) and the second
            // (15-16 min after that), with room to spare.
            await wait(22 * 60 * 1000);

            const log = storedLog();
            const health = log.filter((entry) => String(entry.code || '').startsWith('page-'));

            if (scenario === 'quiet') {
                assert(health.length === 0, `A healthy page was logged: ${JSON.stringify(health)}`);
            } else {
                const codes = health.map((entry) => entry.code).sort();
                assert(codes.join() === 'page-churn-high,page-elements-high',
                    `Expected one churn and one size entry, got: ${JSON.stringify(health)}`);

                for (const entry of health) {
                    assert(entry.moduleId === 'manager', `A health entry was not the Manager's: ${entry.moduleId}`);
                    assert(entry.kind === 'notice', `A health entry was not a notice: ${entry.kind}`);
                    assert(!entry.message, `A health entry carried free text: ${entry.message}`);
                    assert(entry.metrics && entry.metrics.elements >= 70000,
                        `A health entry lost its element count: ${JSON.stringify(entry.metrics)}`);
                    assert(entry.metrics.churn >= 100,
                        `A health entry lost its churn rate: ${JSON.stringify(entry.metrics)}`);
                    for (const value of Object.values(entry.metrics)) {
                        assert(typeof value === 'number', `A metric was not a number: ${JSON.stringify(entry.metrics)}`);
                    }
                }

                // The rows have to say it, and the report a person copies too.
                const gear = document.querySelector('#lectio-manager-toggle');
                assert(gear.classList.contains('has-problems'), 'The gear did not mark a page-health entry');
                gear.click();

                const rows = [...document.querySelectorAll('.lectio-manager-log-entry')].map((row) => row.textContent);
                assert(rows.some((text) => text.includes('page-churn-high') && text.includes('DOM changes/s')),
                    `The churn entry does not read as one: ${rows.join(' | ')}`);

                const preview = document.querySelector('.lectio-manager-log-report').value;
                assert(preview.includes('page-elements-high') && preview.includes('elements'),
                    `The report does not carry the size entry: ${preview}`);
                assert(/This page now: .*elements/.test(preview),
                    `The report does not say where the page stands now: ${preview}`);
            }

            // Every sample has let go of its observer and armed exactly one more.
            assert(window.pageErrors.length === 0,
                `The Manager threw while sampling: ${window.pageErrors.join(' | ')}`);
        }

        window.addEventListener('load', () => {
            if (scenario === 'busy') makeBusy();

            const script = document.createElement('script');
            script.src = '../../manager/Lectio-Manager.user.js';
            script.onload = () => setTimeout(() => {
                run().then(
                    () => { document.documentElement.dataset.testResult = 'pass'; },
                    (error) => { document.documentElement.dataset.testResult = `fail: ${error.message}`; }
                );
            }, 0);
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
