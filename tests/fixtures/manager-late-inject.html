<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <title>Lectio Manager late-injection fixture</title>
</head>
<body>
    <script>
        /*
         * The Manager runs at document-idle, so Tampermonkey hands it a page
         * that has already finished loading: init() is called straight from the
         * boot block, before the rest of the file below it has been evaluated.
         * Anything init reaches must therefore be declared above that block.
         * A const declared below it parses fine, passes a syntax check, and
         * works in any fixture that loads the Manager with a plain <script> tag
         * during parse - and then throws a ReferenceError for every real user.
         * This fixture is the only one that reproduces how the Manager is
         * actually injected.
         */
        /*
         * The cached catalogue carries a real entry, with every optional field
         * a Manager reads. An empty `modules` array used to be enough, and was
         * not: validateCatalogue bails on it before validating anything, so
         * every per-field helper it calls stayed untested at the one moment
         * that matters. One of those helpers was then declared as a const below
         * init()'s call site and threw for every real install while this
         * fixture stayed green.
         */
        const storage = new Map([
            ['lectioManager.catalogue.v1', JSON.stringify({
                schemaVersion: 1,
                generatedAt: '2026-09-20T00:00:00.000Z',
                manager: {
                    version: '1.0.0',
                    installUrl: 'https://raw.githubusercontent.com/RktRobinhood/Lectio-Scripts/main/manager/Lectio-Manager.user.js'
                },
                modules: [{
                    id: 'late-module',
                    name: 'Late Module',
                    description: 'A cached entry the Manager has to validate while booting late.',
                    category: 'Interface',
                    audience: ['student'],
                    aliases: ['late-alias'],
                    status: 'stable',
                    version: '1.0.0',
                    changelog: 'A cached entry with every optional field a Manager reads.',
                    installUrl: 'https://raw.githubusercontent.com/RktRobinhood/Lectio-Scripts/main/modules/late-module.user.js',
                    supportUrl: 'https://github.com/RktRobinhood/Lectio-Scripts/issues',
                    i18n: { da: { name: 'Sent modul', description: 'Dansk beskrivelse.', changelog: 'Dansk ændringstekst.' } }
                }]
            })],
            ['lectioManager.lastRefresh.v1', Date.now()],
            ['lectioManager.updateTipDismissed.v1', true]
        ]);

        window.GM_getValue = (key, fallback) => storage.has(key) ? storage.get(key) : fallback;
        window.GM_setValue = (key, value) => storage.set(key, value);
        window.GM_xmlhttpRequest = () => {};

        window.bootErrors = [];
        window.addEventListener('error', (event) => window.bootErrors.push(String(event.message)));

        // A throw inside validateCatalogue is caught and warned about, not
        // raised, so booting late with a broken validator looks like a Manager
        // that simply has no catalogue. Watch the warnings, not just the errors.
        window.bootWarnings = [];
        const nativeWarn = console.warn.bind(console);
        console.warn = (...args) => { window.bootWarnings.push(args.map(String).join(' ')); nativeWarn(...args); };

        /*
         * A module answering Discovery while the Manager is still evaluating
         * its own file. init() calls requestDiscovery(), so everything the
         * registration path touches - the Storage Declaration among it - is
         * read at exactly the moment that caught 1.21.0 and 1.25.0: during
         * top-level evaluation, with the rest of the file still a dead zone.
         */
        window.addEventListener('lectio-manager:discover', () => {
            window.dispatchEvent(new CustomEvent('lectio-module:register', {
                detail: {
                    id: 'late-module',
                    name: 'Late Module',
                    version: '1.0.0',
                    settingsSchema: [],
                    currentValues: {},
                    storage: [
                        { key: 'lectioLate.settings.v1', kind: 'setting', label: { en: 'Settings', da: 'Indstillinger' } },
                        { prefix: 'lectioLate.cache.v1.', kind: 'cache', prunable: true, label: 'Cache' }
                    ]
                }
            }));
        });

        function assert(condition, message) {
            if (!condition) throw new Error(message);
        }

        window.addEventListener('load', () => {
            assert(document.readyState !== 'loading', 'Test setup injected the Manager too early');

            const script = document.createElement('script');
            script.src = '../../manager/Lectio-Manager.user.js';
            script.onload = () => setTimeout(() => {
                try {
                    assert(window.bootErrors.length === 0, `Manager threw while booting: ${window.bootErrors.join(' | ')}`);
                    assert(document.querySelector('#lectio-manager-toggle'), 'Manager never built its button');

                    // The cached catalogue survived being validated during a
                    // late boot. Discarding it here is silent for the user and
                    // costs them their whole module list until a refetch.
                    const discarded = window.bootWarnings.filter((line) => /Discarding invalid cached catalogue/.test(line));
                    assert(discarded.length === 0,
                        `The Manager threw away its cached catalogue while booting late: ${discarded.join(' | ')}`);

                    // A registration made during evaluation was accepted and
                    // remembered. A throw on the way through is caught by the
                    // dispatcher, so nothing else here would notice.
                    assert(JSON.parse(storage.get('lectioManager.installed.v1') || '{}')['late-module'],
                        'A module registering during the Manager\'s own evaluation was dropped');

                    const dock = document.querySelector('#lectio-manager-dock-root');
                    assert(dock, 'Manager never built its dock');

                    window.dispatchEvent(new CustomEvent('lectio-manager:dock:register', {
                        detail: {
                            moduleId: 'late-module', itemId: 'action', type: 'action',
                            icon: 'info', label: 'Late item'
                        }
                    }));
                    assert(!dock.hidden, 'A dock built after load never became visible');
                    assert(dock.style.getPropertyValue('--lectio-dock-shell-fill') === '30%',
                        'Dock preferences were not applied when the Manager booted after load');

                    document.documentElement.dataset.testResult = 'pass';
                } catch (error) {
                    document.documentElement.dataset.testResult = `fail: ${error.message}`;
                }
            }, 300);

            document.head.appendChild(script);
        });
    </script>
</body>
</html>
