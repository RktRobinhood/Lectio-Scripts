<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Lectio Manager fixture</title>
</head>
<body>
    <script>
        const catalogue = {
            schemaVersion: 1,
            generatedAt: '2026-09-13T00:00:00.000Z',
            modules: [
                {
                    id: 'zulu-interface',
                    name: 'Zulu Interface',
                    description: 'Installed module sorted first by category.',
                    category: 'Interface',
                    audience: ['student', 'teacher'],
                    status: 'stable',
                    version: '1.1.0',
                    installUrl: 'https://raw.githubusercontent.com/RktRobinhood/Lectio-Scripts/main/modules/Zulu.user.js'
                },
                {
                    id: 'alpha-timetable',
                    name: 'Alpha Timetable',
                    description: 'Installed module sorted first by name.',
                    category: 'Timetable',
                    audience: ['student'],
                    status: 'stable',
                    version: '1.0.0',
                    installUrl: 'https://raw.githubusercontent.com/RktRobinhood/Lectio-Scripts/main/modules/Alpha.user.js'
                },
                {
                    id: 'browse-only',
                    name: 'Browse Only',
                    description: 'Module that is not installed.',
                    category: 'Messages',
                    audience: ['teacher'],
                    status: 'stable',
                    version: '1.0.0',
                    installUrl: 'https://raw.githubusercontent.com/RktRobinhood/Lectio-Scripts/main/modules/Browse.user.js'
                }
            ]
        };

        const storage = new Map([
            ['lectioManager.catalogue.v1', JSON.stringify(catalogue)],
            ['lectioManager.lastRefresh.v1', Date.now()],
            ['lectioManager.updateTipDismissed.v1', true]
        ]);

        window.GM_getValue = (key, fallback) => storage.has(key) ? storage.get(key) : fallback;
        window.GM_setValue = (key, value) => storage.set(key, value);
        window.GM_xmlhttpRequest = () => {};
        window.settingEvents = [];
        window.addEventListener('lectio-manager:preview-setting', (event) => {
            window.settingEvents.push(`preview:${event.detail.key}:${event.detail.value}`);
        });
        window.addEventListener('lectio-manager:clear-setting-preview', (event) => {
            window.settingEvents.push(`clear:${event.detail.key}`);
        });
        window.addEventListener('lectio-manager:set-setting', (event) => {
            window.settingEvents.push(`set:${event.detail.key}:${event.detail.value}`);
        });

        window.addEventListener('lectio-manager:discover', () => {
            for (const module of catalogue.modules.slice(0, 2)) {
                window.dispatchEvent(new CustomEvent('lectio-module:register', {
                    detail: {
                        id: module.id,
                        name: module.name,
                        version: module.id === 'zulu-interface' ? '1.0.0' : module.version,
                        settingsSchema: module.id === 'zulu-interface' ? [
                            { key: 'enabled', type: 'toggle', label: 'Enabled', section: 'Behaviour' },
                            { key: 'density', type: 'select', label: 'Spacing', section: 'Appearance', previewOnHover: true, options: ['compact', 'comfortable'] },
                            { key: 'nickname', type: 'text', label: 'Nickname', section: 'Behaviour' }
                        ] : [],
                        currentValues: { enabled: true, density: 'compact', nickname: '' }
                    }
                }));
            }
        });
    </script>
    <script src="../../manager/Lectio-Manager.user.js"></script>
    <script>
        function names() {
            return [...document.querySelectorAll('.lectio-manager-card-name')]
                .map(element => element.textContent.trim());
        }

        function assert(condition, message) {
            if (!condition) throw new Error(message);
        }

        window.addEventListener('load', async () => {
            try {
                    document.querySelector('#lectio-manager-toggle').click();

                    const mainView = document.querySelector('.lectio-manager-main-view');
                    const settingsView = document.querySelector('.lectio-manager-settings-view');
                    const installedTab = document.querySelector('[data-primary-view="installed"]');
                    const availableTab = document.querySelector('[data-primary-view="all"]');

                    assert(installedTab.getAttribute('aria-selected') === 'true', 'Installed is not the primary view');
                    assert(installedTab.textContent.trim() === 'Installed 2', `Installed tab did not show count: ${installedTab.textContent}`);
                    assert(availableTab.textContent.trim() === 'Available 1', `Available tab did not show count: ${availableTab.textContent}`);
                    assert(names().join('|') === 'Zulu Interface|Alpha Timetable', `Unexpected installed order: ${names()}`);
                    assert(!document.querySelector('.lectio-manager-card-desc'), 'Installed cards should be compact');
                    assert(document.querySelector('[data-module-id="zulu-interface"] .lectio-manager-status-update')?.textContent.includes('v1.1.0'), 'Newer catalogue version was not shown');
                    const updateLink = document.querySelector('[data-module-id="zulu-interface"] .lectio-manager-update-btn');
                    assert(updateLink?.textContent === 'Update', 'Update action was not shown');
                    assert(updateLink.href.endsWith('/modules/Zulu.user.js'), 'Update action did not use the approved install URL');

                    document.querySelector('[data-sort="name"]').click();
                    assert(names().join('|') === 'Alpha Timetable|Zulu Interface', `Name sort did not update immediately: ${names()}`);
                    assert(document.querySelector('[data-sort="name"]'), 'Sort controls disappeared after sorting');

                    availableTab.click();
                    assert(availableTab.getAttribute('aria-selected') === 'true', 'Available tab did not activate');
                    assert(names().join('|') === 'Browse Only', `Available view did not narrow to uninstalled modules: ${names()}`);
                    assert(document.querySelector('.lectio-manager-view-heading').textContent === 'Available · 1', 'Available heading did not show its filtered count');
                    assert(document.querySelector('.lectio-manager-card-desc'), 'Available cards should include descriptions');

                    document.querySelector('.lectio-manager-nav-trigger').click();
                    document.querySelector('[data-view="audience:teacher"]').click();
                    assert(names().join('|') === 'Browse Only', `Audience filter returned installed modules: ${names()}`);
                    assert(!document.querySelector('.lectio-manager-nav-menu').hidden, 'Filter menu closed after changing the Audience filter');
                    assert(document.querySelector('.lectio-manager-nav-trigger').getAttribute('aria-expanded') === 'true', 'Filter trigger did not remain expanded after changing the Audience filter');
                    assert(document.querySelector('[data-view="audience:teacher"]').getAttribute('aria-checked') === 'true', 'Audience filter did not expose selected state');
                    document.querySelector('[data-view="category:Messages"]').click();
                    assert(names().join('|') === 'Browse Only', `Category filter returned the wrong modules: ${names()}`);
                    assert(!document.querySelector('.lectio-manager-nav-menu').hidden, 'Filter menu closed after changing the Category filter');
                    assert(document.querySelector('.lectio-manager-nav-current').textContent === 'Messages', 'Active filter label did not update while the menu remained open');
                    assert(document.querySelector('[data-view="category:Messages"]').getAttribute('aria-checked') === 'true', 'Category filter did not expose selected state');

                    window.dispatchEvent(new CustomEvent('lectio-module:register', {
                        detail: { id: 'browse-only', name: 'Browse Only', version: '1.0.0' }
                    }));
                    availableTab.click();
                    assert(document.querySelector('.lectio-manager-available-count').textContent === '0', 'Available count did not update after detecting all modules');
                    assert(document.querySelector('.lectio-manager-loading').textContent === 'All available modules are installed.', 'Available empty state was unclear');

                    installedTab.click();
                    assert(document.querySelector('.lectio-manager-nav-menu').hidden, 'Switching primary tabs did not close the filter menu');
                    document.querySelector('[data-module-id="zulu-interface"] .lectio-manager-settings-btn').click();
                    settingsView.querySelector('.lectio-manager-settings-back').click();
                    assert(installedTab.getAttribute('aria-selected') === 'true', 'Settings did not return to Installed');

                    document.querySelector('[data-module-id="zulu-interface"] .lectio-manager-settings-btn').click();
                    await Promise.resolve();
                    assert(mainView.hidden, 'Module list remained visible behind focused settings');
                    assert(!settingsView.hidden, 'Focused settings view did not open');
                    assert([...settingsView.querySelectorAll('.lectio-manager-settings-section-heading')]
                        .map(element => element.textContent).join('|') === 'Behaviour|Appearance', 'Settings were not grouped by section');

                    const previewTrigger = settingsView.querySelector('.lectio-manager-preview-select-trigger');
                    previewTrigger.click();
                    const comfortableOption = settingsView.querySelector('[data-preview-value="comfortable"]');
                    comfortableOption.dispatchEvent(new MouseEvent('mouseenter'));
                    assert(window.settingEvents.includes('preview:density:comfortable'), 'Hovering a preview option did not emit a temporary preview');
                    comfortableOption.dispatchEvent(new MouseEvent('mouseleave'));
                    assert(window.settingEvents.includes('clear:density'), 'Leaving a preview option did not restore the saved setting');
                    comfortableOption.click();
                    assert(window.settingEvents.includes('set:density:comfortable'), 'Choosing a preview option did not persist it');

                    previewTrigger.click();
                    settingsView.querySelector('.lectio-manager-preview-select-menu')
                        .dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
                    assert(!settingsView.hidden, 'Closing the preview dropdown with Escape also closed settings');
                    assert(previewTrigger.getAttribute('aria-expanded') === 'false', 'Escape did not close the preview dropdown');

                    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
                    assert(!mainView.hidden && settingsView.hidden, 'Escape did not restore the module list');

                    document.querySelector('[data-module-id="zulu-interface"] .lectio-manager-settings-btn').click();
                    settingsView.querySelector('.lectio-manager-settings-back').click();
                    assert(!mainView.hidden && settingsView.hidden, 'Back did not restore the module list');

                    // A module can re-register with a grown settingsSchema while its
                    // settings view is open (Subject Colours discovering classes in the
                    // background). The Manager should refresh that view generically, but
                    // never discard a keystroke someone is mid-way through typing.
                    document.querySelector('[data-module-id="zulu-interface"] .lectio-manager-settings-btn').click();
                    await Promise.resolve();
                    const nicknameInput = settingsView.querySelector('input[type="text"]');
                    nicknameInput.focus();
                    nicknameInput.value = 'Hal';
                    assert(document.activeElement === nicknameInput, 'Test setup: text field did not receive focus');

                    window.dispatchEvent(new CustomEvent('lectio-module:register', {
                        detail: {
                            id: 'zulu-interface',
                            name: 'Zulu Interface',
                            version: '1.0.0',
                            settingsSchema: [
                                { key: 'enabled', type: 'toggle', label: 'Enabled', section: 'Behaviour' },
                                { key: 'density', type: 'select', label: 'Spacing', section: 'Appearance', previewOnHover: true, options: ['compact', 'comfortable'] },
                                { key: 'nickname', type: 'text', label: 'Nickname', section: 'Behaviour' },
                                { key: 'notify', type: 'toggle', label: 'Notify', section: 'Behaviour' }
                            ],
                            currentValues: { enabled: true, density: 'comfortable', nickname: '', notify: false }
                        }
                    }));
                    assert(document.activeElement === nicknameInput && nicknameInput.value === 'Hal',
                        'Re-registering while a text field was focused discarded the in-progress edit');
                    assert(settingsView.querySelectorAll('.lectio-manager-setting-label').length === 3,
                        'Re-registering while a text field was focused rebuilt the settings view immediately');

                    nicknameInput.blur();
                    await new Promise((resolvePromise) => setTimeout(resolvePromise, 0));
                    assert(settingsView.querySelectorAll('.lectio-manager-setting-label').length === 4,
                        'Blurring the busy text field did not apply the queued settings refresh');

                document.documentElement.dataset.testResult = 'pass';
            } catch (error) {
                document.documentElement.dataset.testResult = `fail: ${error.message}`;
            }
        });
    </script>
</body>
</html>
