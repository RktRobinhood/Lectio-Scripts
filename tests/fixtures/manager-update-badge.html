<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Lectio Manager update-badge fixture</title>
</head>
<body>
    <script>
        // The gear is eager and the panel is lazy, so the count on the gear has
        // to come from catalogue-versus-registration state rather than from the
        // update lines the panel renders. Everything below the first open is
        // checked with no panel in the document at all.
        const catalogue = {
            schemaVersion: 1,
            generatedAt: '2026-09-20T00:00:00.000Z',
            manager: {
                // Older than the running Manager, so nothing here is the
                // Manager's own self-update - that is the other fixture.
                version: '1.0.0',
                installUrl: 'https://raw.githubusercontent.com/RktRobinhood/Lectio-Scripts/main/manager/Lectio-Manager.user.js'
            },
            // Ten outdated modules is reachable in practice and is what makes
            // the badge two digits wide, which is the width #50 was filed about.
            modules: [
                'current', 'alpha', 'beta', 'gamma', 'delta',
                'epsilon', 'zeta', 'eta', 'theta', 'iota', 'kappa', 'lambda'
            ].map((id) => ({
                id,
                name: id[0].toUpperCase() + id.slice(1),
                description: `Catalogue entry for ${id}.`,
                category: 'Interface',
                audience: ['student'],
                status: 'stable',
                version: '2.0.0',
                installUrl: `https://raw.githubusercontent.com/RktRobinhood/Lectio-Scripts/main/modules/${id}.user.js`
            }))
        };

        // One module installed and already current: installed modules exist, so
        // an empty badge here is "nothing to update", not "nothing to compare".
        //
        // And a stored problem log that has been read in full - one entry a
        // module owns, one the Manager could not attribute, and a seen marker
        // newer than both. Issue #62 reported the problem mark flashing on
        // the gear on a page refresh with nothing unread; the observer below
        // watches the gear from before the Manager runs, so a mark that is
        // drawn and then taken back is caught rather than missed.
        const readLog = [
            { at: Date.now() - 7200000, kind: 'drift', moduleId: 'current', code: 'lesson-blocks',
                found: 0, message: '', where: 'other', count: 3 },
            { at: Date.now() - 7200000, kind: 'error', moduleId: '', code: 'uncaught',
                found: null, message: 'TypeError: <text>', where: 'other', count: 1 }
        ];

        const storage = new Map([
            ['lectioManager.catalogue.v1', JSON.stringify(catalogue)],
            ['lectioManager.lastRefresh.v1', Date.now()],
            ['lectioManager.updateTipDismissed.v1', true],
            ['lectioManager.installed.v1', JSON.stringify({
                current: { name: 'Current', version: '2.0.0', lastSeenAt: Date.now() - 60000 }
            })],
            ['lectioManager.log.v1', JSON.stringify(readLog)],
            ['lectioManager.logSeen.v1', Date.now() - 3600000]
        ]);

        window.GM_getValue = (key, fallback) => storage.has(key) ? storage.get(key) : fallback;
        window.GM_setValue = (key, value) => storage.set(key, value);

        // Every value the gear's class attribute has held, from its insertion
        // on. A --dump-dom sees only the final DOM; a transient mark is exactly
        // what it cannot see, and what this records. The records are delivered
        // after the Manager's boot has run to completion, so what a record
        // carries is the value *before* each change (attributeOldValue) - the
        // one a live read would already have lost - and a class the gear was
        // inserted with and then stripped shows up as the old value of the
        // change that stripped it.
        window.gearStates = [];
        new MutationObserver((records) => {
            for (const record of records) {
                if (record.type === 'childList') {
                    for (const node of record.addedNodes) {
                        const gear = node.id === 'lectio-manager-toggle'
                            ? node
                            : node.querySelector?.('#lectio-manager-toggle');
                        if (gear) window.gearStates.push('inserted');
                    }
                } else if (record.target.id === 'lectio-manager-toggle' && record.attributeName === 'class') {
                    window.gearStates.push(`class:${record.oldValue ?? ''}>${record.target.className}`);
                }
            }
        }).observe(document.documentElement, {
            subtree: true, childList: true, attributes: true, attributeOldValue: true
        });
        // No network at all, in either direction: the badge must not cause one.
        let networkCalls = 0;
        window.GM_xmlhttpRequest = () => { networkCalls += 1; };

        window.pageErrors = [];
        window.addEventListener('error', (event) => window.pageErrors.push(String(event.message)));

        function register(id, version) {
            window.dispatchEvent(new CustomEvent('lectio-module:register', {
                detail: { id, name: id[0].toUpperCase() + id.slice(1), version, settingsSchema: [] }
            }));
        }
    </script>
    <script src="../../manager/Lectio-Manager.user.js"></script>
    <script>
        function assert(condition, message) {
            if (!condition) throw new Error(message);
        }

        window.addEventListener('load', async () => {
            try {
                const gear = document.querySelector('#lectio-manager-toggle');
                assert(gear, 'The gear was not built');

                const badge = () => gear.getAttribute('data-update-count');
                const label = () => gear.getAttribute('aria-label');
                const panelBuilt = () => Boolean(document.querySelector('#lectio-manager-panel'));
                const size = () => {
                    const box = gear.getBoundingClientRect();
                    return `${Math.round(box.width)}x${Math.round(box.height)}`;
                };

                const unbadgedSize = size();

                // 1. Nothing to update: no badge, and the gear's name is just
                //    the Manager's, exactly as it was before this existed.
                assert(!panelBuilt(), 'The panel was built without a gear click');
                assert(badge() === null, `A badge appeared with nothing to update: ${badge()}`);
                assert(label() === 'Lectio Tools', `The gear's name changed with nothing to update: ${label()}`);
                assert(!document.querySelector('[data-dock-key]'), 'The update badge put something in the dock');

                // 1b. Nothing unread either, at any point: the stored log has
                //     been read in full, so the problem mark must never have
                //     been drawn - not even for the instant between the gear
                //     being built and its state being known (issue #62).
                assert(window.gearStates.length > 0, 'The observer never saw the gear being built');
                assert(!window.gearStates.some((state) => state.includes('has-problems')),
                    `The gear carried a problem mark with nothing unread: ${window.gearStates.join(', ')}`);
                assert(!gear.classList.contains('has-problems'), 'The gear shows a problem mark with nothing unread');

                // 2. One update, with the panel still never opened. This is the
                //    whole point: the count is state, not rendered panel DOM.
                register('alpha', '1.0.0');
                assert(!panelBuilt(), 'Registering a module built the panel');
                assert(badge() === '1', `One outdated module did not count as one: ${badge()}`);
                assert(label() === 'Lectio Tools — 1 update available',
                    `The single-update name is wrong or missing: ${label()}`);
                assert(size() === unbadgedSize, `The badge resized the gear: ${unbadgedSize} → ${size()}`);

                // 3. Several.
                register('beta', '1.0.0');
                register('gamma', '1.9.9');
                assert(!panelBuilt(), 'The panel appeared before it was asked for');
                assert(badge() === '3', `Three outdated modules did not count as three: ${badge()}`);
                assert(label() === 'Lectio Tools — 3 updates available',
                    `The plural name is wrong: ${label()}`);
                assert(size() === unbadgedSize, `The badge resized the gear: ${unbadgedSize} → ${size()}`);

                // 4. Back to current, from a state that had a badge.
                register('alpha', '2.0.0');
                register('beta', '2.0.0');
                register('gamma', '2.0.0');
                assert(badge() === null, `The badge survived every module catching up: ${badge()}`);
                assert(label() === 'Lectio Tools', `The gear's name kept a stale count: ${label()}`);

                // 5. Both indicators at once. Since #50 the count owns the top
                //    right - the prominent corner, and the one with room for a
                //    number - and the problem mark (1.23.0) owns the bottom
                //    one, so neither can hide the other and the name carries
                //    both.
                register('alpha', '1.0.0');
                register('beta', '1.0.0');
                register('gamma', '1.0.0');
                window.dispatchEvent(new CustomEvent('lectio-module:report', {
                    detail: { moduleId: 'alpha', kind: 'drift', code: 'lesson-blocks', found: 0 }
                }));

                assert(gear.classList.contains('has-problems'), 'The badge suppressed the problem mark');
                assert(badge() === '3', `The problem mark suppressed the badge: ${badge()}`);
                assert(label().includes('1 problem recorded') && label().includes('3 updates available'),
                    `The gear's name does not carry both signals: ${label()}`);

                const mark = getComputedStyle(gear, '::after');
                const count = getComputedStyle(gear, '::before');
                assert(mark.content !== 'none', 'The problem mark is not drawn');
                assert(count.content.includes('3'), `The badge does not draw the count: ${count.content}`);
                // Chrome resolves the offset that was not written as well as
                // the one that was, so which corner an indicator is in is the
                // smaller of the two offsets, not whichever one is a number.
                const corner = (style) => {
                    const top = parseFloat(style.top);
                    const bottom = parseFloat(style.bottom);
                    if (Number.isFinite(top) && Number.isFinite(bottom)) return top < bottom ? 'top' : 'bottom';
                    return Number.isFinite(top) ? 'top' : 'bottom';
                };

                assert(corner(count) === 'top',
                    `The count is not in the top corner: top ${count.top}, bottom ${count.bottom}`);
                assert(corner(mark) === 'bottom',
                    `The problem mark is not in the bottom corner: top ${mark.top}, bottom ${mark.bottom}`);
                assert(count.pointerEvents === 'none', 'The badge can swallow a click meant for the gear');
                assert(size() === unbadgedSize, `Two indicators resized the gear: ${unbadgedSize} → ${size()}`);

                // 5b. Legible, and legible at two digits. 11px was the font and
                //     11px was the whole box before #50, which squeezed a
                //     two-digit count against the rounded ends; the box has to
                //     grow with the number rather than hold it.
                const oneDigitWidth = parseFloat(count.width);
                assert(parseFloat(count.height) >= 16,
                    `The badge is too short to read: ${count.height}`);
                assert(parseFloat(count.fontSize) >= 11,
                    `The badge's text is too small to read: ${count.fontSize}`);

                for (const id of ['epsilon', 'zeta', 'eta', 'theta', 'iota', 'kappa', 'lambda']) {
                    register(id, '1.0.0');
                }

                assert(badge() === '10', `Ten outdated modules did not count as ten: ${badge()}`);

                const wide = getComputedStyle(gear, '::before');
                assert(wide.content.includes('10'), `The badge does not draw two digits: ${wide.content}`);
                assert(parseFloat(wide.width) > oneDigitWidth,
                    `A two-digit count is squeezed into the one-digit box: ${oneDigitWidth} → ${wide.width}`);
                assert(size() === unbadgedSize, `A two-digit badge resized the gear: ${unbadgedSize} → ${size()}`);

                // 6. Nothing threw while all of that happened with no panel.
                assert(window.pageErrors.length === 0,
                    `The Manager threw before its panel existed: ${window.pageErrors.join(' | ')}`);

                // 7. Opening the panel is looking, not installing. Before #50
                //    the badge went out on this click - including a click for
                //    something else entirely - and never came back for the same
                //    outstanding update. It has to survive the panel.
                gear.click();
                assert(panelBuilt(), 'The first gear click did not build the panel');
                assert(document.querySelectorAll('.lectio-manager-status-update').length === 10,
                    'The badge counted something the panel does not show as an update');
                assert(badge() === '10', `Opening the panel cleared the badge: ${badge()}`);
                assert(label().includes('10 updates available'),
                    `Opening the panel dropped the count from the gear's name: ${label()}`);

                // 8. Closing and reopening still shows it, because nothing has
                //    been updated.
                gear.click();
                gear.click();
                assert(badge() === '10', `The badge did not come back on reopen: ${badge()}`);
                gear.click();
                assert(badge() === '10', `Closing the panel cleared the badge: ${badge()}`);

                // 9. Resolution is what clears it, one module at a time.
                register('alpha', '2.0.0');
                assert(badge() === '9', `Updating one module did not take one off the count: ${badge()}`);

                for (const id of ['beta', 'gamma', 'epsilon', 'zeta', 'eta', 'theta', 'iota', 'kappa', 'lambda']) {
                    register(id, '2.0.0');
                }

                assert(badge() === null, `The badge survived every update being applied: ${badge()}`);
                assert(label().includes('1 problem recorded') && !label().includes('update'),
                    `The gear's name kept a stale count: ${label()}`);

                // 9b. And a genuinely new update badges again.
                register('delta', '1.0.0');
                assert(badge() === '1', `A new update did not reappear on the gear: ${badge()}`);

                // 10. None of this touched the dock or the network.
                assert(!document.querySelector('[data-dock-key]'), 'The update badge put something in the dock');
                assert(networkCalls === 0, `The badge caused ${networkCalls} network requests`);
                assert(window.pageErrors.length === 0,
                    `The update badge threw: ${window.pageErrors.join(' | ')}`);

                // 11. The mark follows the log's read state, not this page's
                //     memory of it (issue #62). A page cannot read the log by
                //     itself, so the marker moving under it means another
                //     Lectio tab opened the log - or this page is back from
                //     the bfcache and the log was read while it was away. The
                //     mark from step 5 is still up; the marker advances as the
                //     other tab's Manager would advance it; and the moment
                //     this page is looked at again, the mark is gone, without
                //     waiting for a reload.
                assert(gear.classList.contains('has-problems'), 'The problem mark from step 5 was lost');
                storage.set('lectioManager.logSeen.v1', Date.now());
                document.dispatchEvent(new Event('visibilitychange'));
                assert(!gear.classList.contains('has-problems'),
                    'The gear kept a problem mark the log had been read out from under');
                assert(!label().includes('problem'),
                    `The gear's name kept a stale problem count: ${label()}`);

                // 11b. And it goes on being one signal: a report after that
                //      marks the gear again, so this is a fresh read of the
                //      marker and not the mark being switched off for good.
                //      Spun rather than awaited, because --dump-dom prints the
                //      page at load and a timer here would land after it; the
                //      marker and the report must not share a millisecond.
                for (const until = Date.now() + 2; Date.now() < until;) { /* wait */ }
                window.dispatchEvent(new CustomEvent('lectio-module:report', {
                    detail: { moduleId: 'alpha', kind: 'drift', code: 'room-links', found: 0 }
                }));
                assert(gear.classList.contains('has-problems'), 'A report after the marker moved did not mark the gear');

                document.documentElement.dataset.testResult = 'pass';
            } catch (error) {
                document.documentElement.dataset.testResult = `fail: ${error.message}`;
            }
        });
    </script>
</body>
</html>
