<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <title>Chairs Up background-fetch safety fixture</title>
    <script>
        /* Two room-week requests that never answer, which is what a captive
           portal or a wedged Lectio looks like from the browser. Nothing here
           resolves on its own: the only way either promise settles is the
           module aborting it, so a module without the safety net simply hangs
           and the assertions below time out. */
        window.fetchLog = [];
        window.maxConcurrentFetches = 0;

        let concurrentFetches = 0;

        window.fetch = (url, init) => {
            const record = {
                url: String(url),
                credentials: init && init.credentials,
                hasSignal: Boolean(init && init.signal),
                startedAt: Date.now(),
                aborted: false,
                abortedAfterMs: -1
            };

            window.fetchLog.push(record);

            concurrentFetches += 1;
            window.maxConcurrentFetches = Math.max(window.maxConcurrentFetches, concurrentFetches);

            /* The page goes away while the second request is still in flight.
               Chairs Up has to abort it there rather than leave it running
               against a page nobody is looking at any more. */
            if (window.fetchLog.length === 2) {
                setTimeout(() => window.dispatchEvent(new Event('pagehide')), 100);
            }

            return new Promise((_, reject) => {
                const signal = init && init.signal;

                if (!signal) return;

                signal.addEventListener('abort', () => {
                    record.aborted = true;
                    record.abortedAfterMs = Date.now() - record.startedAt;
                    concurrentFetches -= 1;
                    reject(new DOMException('The user aborted a request.', 'AbortError'));
                });
            });
        };

        /* A room map already harvested and still well inside its ~30 days, so
           the run needs no discovery requests and the only fetches are the two
           room-week refreshes this test is about. */
        window.SEEDED_ROOM_MAP = JSON.stringify({ '1.05': 'RO123', '2.10': 'RO456' });
        window.SEEDED_ROOM_MAP_TIME = String(Date.now());

        localStorage.clear();
        localStorage.setItem('lectioChairsUp.v102.223.roomMap', window.SEEDED_ROOM_MAP);
        localStorage.setItem('lectioChairsUp.v102.223.roomMapTime', window.SEEDED_ROOM_MAP_TIME);
    </script>
</head>
<body>
    <div id="masterContent">
        <table id="timetable"><tr id="lessons"></tr></table>
    </div>

    <script>
        /* Tomorrow, so both lessons are inside the module's seven-day
           lookahead and neither has a room-week cache yet - two refresh jobs,
           one per room. */
        const lessonDate = new Date();
        lessonDate.setDate(lessonDate.getDate() + 1);

        const lectioDate = lessonDate.getDate() + '/' + (lessonDate.getMonth() + 1) +
            '-' + lessonDate.getFullYear();

        const lessons = document.getElementById('lessons');

        for (const [index, [absid, room]] of [['81266224401', '1.05'], ['81266224402', '2.10']].entries()) {
            const cell = document.createElement('td');
            const brick = document.createElement('a');

            brick.className = 's2skemabrik s2brik';
            brick.href = '/lectio/223/aktivitet/aktivitetforside2.aspx?absid=' + absid;
            brick.setAttribute('data-brikid', 'ABS' + absid);
            brick.setAttribute('data-tooltip', [
                lectioDate + ' 09:40 til 10:50',
                'Hold: 1i Psyc HL',
                'Laerer: MP',
                'Lokale: ' + room
            ].join('\n'));
            brick.textContent = 'Lektion ' + (index + 1);

            cell.appendChild(brick);
            lessons.appendChild(cell);
        }
    </script>

    <script src="/modules-unstable/Lectio-Chairs-Up.user.js"></script>

    <script>
        const failures = [];
        const assert = (condition, message) => {
            if (!condition) failures.push(message);
        };

        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        const waitFor = async (predicate, label) => {
            for (let attempt = 0; attempt < 400; attempt += 1) {
                if (predicate()) return true;
                await wait(50);
            }
            failures.push('timed out waiting for ' + label);
            return false;
        };

        (async () => {
            const log = window.fetchLog;

            await waitFor(
                () => log.length === 2 && log[1].aborted,
                'both room-week requests to be attempted and finished'
            );

            /* --- Never stack ------------------------------------------- */

            assert(
                log.length === 2,
                'expected exactly two room-week requests, got ' + log.length
            );
            assert(
                window.maxConcurrentFetches === 1,
                'a request started while another was still in flight (peak ' +
                    window.maxConcurrentFetches + ' at once)'
            );

            if (log.length === 2) {
                assert(
                    log[1].startedAt >= log[0].startedAt + log[0].abortedAfterMs,
                    'the second request started before the first one had finished'
                );
                assert(
                    /id=RO123/.test(log[0].url) && /id=RO456/.test(log[1].url),
                    'the two requests should be the two rooms, got: ' +
                        log.map((entry) => entry.url).join(' , ')
                );
            }

            /* --- Timeout and abort -------------------------------------- */

            for (const [index, entry] of log.entries()) {
                assert(entry.hasSignal, 'request ' + index + ' carried no abort signal');
                assert(entry.aborted, 'request ' + index + ' was never aborted');
                assert(
                    entry.credentials === 'include',
                    'request ' + index + ' stopped sending the Lectio session cookie'
                );
                assert(
                    /SkemaNy\.aspx\?type=lokale/.test(entry.url),
                    'request ' + index + ' was not a room-week request: ' + entry.url
                );
            }

            if (log.length === 2) {
                /* The first hang is ended by the module's own hard timeout,
                   not by anything this fixture does. */
                assert(
                    log[0].abortedAfterMs >= 4000 && log[0].abortedAfterMs <= 12000,
                    'the hung request should have been timed out near eight seconds, was ' +
                        log[0].abortedAfterMs + 'ms'
                );

                /* The second is ended by pagehide, well before its timeout. */
                assert(
                    log[1].abortedAfterMs <= 3000,
                    'pagehide should have aborted the in-flight request immediately, took ' +
                        log[1].abortedAfterMs + 'ms'
                );
            }

            /* --- The room-id cache is none of this net's business -------- */

            assert(
                localStorage.getItem('lectioChairsUp.v102.223.roomMap') === window.SEEDED_ROOM_MAP,
                'the harvested room map was rewritten'
            );
            assert(
                localStorage.getItem('lectioChairsUp.v102.223.roomMapTime') === window.SEEDED_ROOM_MAP_TIME,
                'the room map expiry clock was restarted'
            );

            const output = document.createElement('pre');
            output.id = 'test-result';
            output.textContent = failures.length ? failures.join(' | ') : 'pass';
            document.body.dataset.testResult = failures.length ? 'fail' : 'pass';
            document.body.appendChild(output);
        })();
    </script>
</body>
</html>
