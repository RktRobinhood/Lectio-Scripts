<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <title>Lectio module request-slot fixture</title>
    <script>
        /*
         * The module half of the request-slot contract
         * (docs/manager-request-slots.md), for all four background-fetching
         * modules at once, under five different Managers - which is the only
         * way to check the property that matters, because four of the five are
         * about a Manager that is missing, old or not answering.
         *
         * The scenario comes off the query string:
         *
         *   none    no Manager at all
         *   silent  something that answers Discovery but has never heard of
         *           slots, which is what an old Manager looks like from here
         *   acked   a Manager that says "wait" and then dies
         *   old     Manager 1.27.0, the real last release before slots existed
         *   real    the Manager in this working tree
         *
         * A module must fetch in every one of them. The only thing that may
         * differ is when.
         */
        window.SCENARIO = new URLSearchParams(location.search).get('scenario') || 'none';

        /* Every module's start jitter is Math.random() * a window, once each.
           Pinned to zero so all four wake as close together as the modules
           allow: a broker that only looks like it works because nothing
           collided would prove nothing. */
        Math.random = () => 0;

        window.pageStartedAt = Date.now();
        window.pageErrors = [];
        window.addEventListener('error', (event) => window.pageErrors.push(String(event.message)));

        /* Slot traffic, in both directions, with timestamps. A module's own
           wait is observable from here without reaching inside it: it asks,
           and it releases when the work behind the turn has finished. */
        window.slotEvents = [];
        for (const name of ['request', 'wait', 'grant', 'release']) {
            window.addEventListener(`lectio-manager:slot:${name}`, (event) => {
                const detail = event.detail || {};
                window.slotEvents.push({
                    name,
                    moduleId: detail.moduleId,
                    requestId: detail.requestId,
                    at: Date.now() - window.pageStartedAt
                });
            });
        }

        /* How long one stubbed request stays open.
         *
         * This is the width of the window the `silent` control below needs,
         * and it is the only reason that control is not a coin flip. With the
         * start jitter pinned to zero above, the four modules schedule their
         * first background request at +0ms (Chairs Up), +0ms (Change Radar),
         * +700ms (Unread) and +1800ms (Subject Colours) from their own load,
         * and each then falls through its own answer window SLOT_ANSWER_MS
         * later - so the requests themselves arrive spread across that same
         * 1800ms, however the browser is feeling.
         *
         * At 300ms only the first two ever overlapped, and only because those
         * two <script> tags load back to back. That made the control a race
         * against real time rather than a measurement: on 2026-09-20 a loaded
         * machine put 840ms of real work between them, the four requests
         * arrived 1.3s, 2.1s, 2.8s and 3.9s in, nothing overlapped, and the
         * control asserted itself into a false failure.
         *
         * A stubbed request that outlives the whole 1800ms spread removes the
         * race instead of narrowing it: all four are in flight together, and
         * the control only fails if *every* pair of them comes apart. Chrome
         * fast-forwards the idle stretches of its virtual clock, so the extra
         * length is not real time: measured either side of the change, a
         * launch came out the same within the machine's own noise.
         *
         * There is a ceiling on it, and it is not the modules' fetch timeout
         * (8s, Chairs Up and Unread) - it is the other 8s, the ceiling a
         * module will wait for a slot before going anyway. In `real` the
         * broker queues the four of them, so the last one waits 3 x FETCH_MS;
         * past about 2600 it would give up on a Manager that is working
         * perfectly, fetch anyway, and fail the serialisation check. Anyone
         * widening this further has to move that assertion's scenario too.
         *
         * Widening it cannot buy a pass in either direction. Modules that
         * genuinely take turns never start a second request while one is
         * still open, whatever this is set to - and in `real` a longer
         * request only widens the window in which an overlap would be seen.
         */
        const FETCH_MS = 2000;

        /* What the ceilings below allow a turn on top of the constants it is
           made of: scheduling noise, on a machine running the rest of the
           suite beside this one. Deliberately small next to SLOT_ANSWER_MS,
           because every ceiling here has to stay clear of it to mean
           anything. */
        const TURN_SLACK_MS = 700;

        window.fetchLog = [];
        window.maxConcurrentFetches = 0;
        let concurrent = 0;

        const TIMETABLE = '<!DOCTYPE html><html><body><table>'
            + '<tr class="s2dayHeader"><th>Uge 38</th></tr>'
            + '<tr><td data-date="2026-09-14">'
            + '<a class="s2skemabrik s2brik s2normal" href="/lectio/223/aktivitet/aktivitetforside2.aspx?absid=900001" '
            + 'data-tooltip="Matematik A&#10;14/9-2026 08:00 til 09:30&#10;Hold: 3a MA&#10;Lokaler: A12">'
            + '<span class="s2skemabrikcontent">Matematik A</span></a>'
            + '</td></tr></table></body></html>';

        window.fetch = (url, init) => {
            const record = {
                url: String(url),
                startedAt: Date.now() - window.pageStartedAt,
                endedAt: -1
            };
            window.fetchLog.push(record);

            concurrent += 1;
            window.maxConcurrentFetches = Math.max(window.maxConcurrentFetches, concurrent);

            return new Promise((resolve) => {
                setTimeout(() => {
                    concurrent -= 1;
                    record.endedAt = Date.now() - window.pageStartedAt;
                    resolve(new Response(TIMETABLE, {
                        status: 200,
                        headers: { 'content-type': 'text/html' }
                    }));
                }, FETCH_MS);
            });
        };

        /* The Manager's own storage, for the scenarios that load one. */
        const managerStorage = new Map([
            ['lectioManager.updateTipDismissed.v1', true],
            ['lectioManager.lastRefresh.v1', Date.now()]
        ]);
        window.GM_getValue = (key, fallback) => managerStorage.has(key) ? managerStorage.get(key) : fallback;
        window.GM_setValue = (key, value) => managerStorage.set(key, value);
        window.GM_xmlhttpRequest = () => {};

        localStorage.clear();

        /* One watched week and nothing else, so Change Radar's check is a
           small, countable number of requests. */
        localStorage.setItem('lectioChangeRadar.v1.223.current-user.settings', JSON.stringify({
            displayMode: 'floating',
            pollMinutes: 5,
            weeksAhead: 0,
            trackAssignments: false,
            trackAbsence: false,
            trackDocuments: false
        }));

        if (window.SCENARIO === 'silent' || window.SCENARIO === 'acked') {
            /* Something is here, and it answers Discovery - so a module cannot
               tell from the handshake whether slots are understood. `silent`
               never answers a slot request, which is exactly what every
               Manager before 1.28.0 does. `acked` says "wait" and then never
               comes back, which is a Manager that died holding the queue. */
            window.addEventListener('lectio-module:register', () => {});
            window.dispatchEvent(new CustomEvent('lectio-manager:discover'));

            if (window.SCENARIO === 'acked') {
                window.addEventListener('lectio-manager:slot:request', (event) => {
                    const detail = event.detail || {};
                    window.dispatchEvent(new CustomEvent('lectio-manager:slot:wait', {
                        detail: { moduleId: detail.moduleId, requestId: detail.requestId }
                    }));
                });
            }
        }

        if (window.SCENARIO === 'real' || window.SCENARIO === 'old') {
            document.write('<scr' + 'ipt src="'
                + (window.SCENARIO === 'old' ? '/manager-old.js' : '/manager/Lectio-Manager.user.js')
                + '"></scr' + 'ipt>');
        }
    </script>
</head>
<body>
    <div id="nav">
        <a href="/lectio/223/beskeder2.aspx">Beskeder</a>
    </div>

    <table id="s_m_Content_Content_SkemaNy_skematabel">
        <tr class="s2dayHeader"><th>Uge 38</th></tr>
        <tr>
            <td data-date="2026-09-14">
                <a class="s2skemabrik s2brik s2normal" href="/lectio/223/aktivitet/aktivitetforside2.aspx?absid=900001"
                   data-tooltip="Matematik A&#10;14/9-2026 08:00 til 09:30&#10;Hold: 3a MA&#10;Lokaler: A12">
                    <span class="s2skemabrikcontent">Matematik A</span>
                </a>
            </td>
        </tr>
    </table>

    <pre id="test-result" data-test-result="pending">PENDING</pre>

    <script src="/modules/Lectio-Subject-Colours.user.js"></script>
    <script src="/modules/Lectio-Chairs-Up.user.js"></script>
    <script src="/modules/Lectio-Unread-Message-Notifications.user.js"></script>
    <script src="/modules/Lectio-Change-Radar.user.js"></script>

    <script>
        const SLOT_ANSWER_MS = 1200;
        const SLOT_MAX_WAIT_MS = 8000;

        /* Every module that fetches in the background asks for a turn. */
        const ASKERS = ['subject-colours', 'chairs-up', 'message-notifications', 'change-radar'];

        function assert(condition, message) {
            if (!condition) throw new Error(message);
        }

        /* What one module's first turn cost it: from asking to handing it back.
           The stub answers in FETCH_MS, so this is the wait plus a known
           constant - which is what makes a starved module visible. */
        function turnAt(moduleId, index) {
            const asks = window.slotEvents.filter((entry) =>
                entry.name === 'request' && entry.moduleId === moduleId);
            const asked = index < 0 ? asks[asks.length + index] : asks[index];
            if (!asked) return null;

            const given = window.slotEvents.find((entry) =>
                entry.name === 'release' && entry.moduleId === moduleId
                && entry.requestId === asked.requestId && entry.at >= asked.at);

            return {
                asks: asks.length,
                asked: asked.at,
                released: given ? given.at : null,
                cost: given ? given.at - asked.at : null
            };
        }

        const firstTurn = (moduleId) => turnAt(moduleId, 0);
        const lastTurn = (moduleId) => turnAt(moduleId, -1);

        window.addEventListener('load', async () => {
            const output = document.getElementById('test-result');

            /* Long enough for the slowest scenario, which is now `real`:
               twelve requests taken strictly in turn, at FETCH_MS each, after
               Subject Colours arms its scan at 1.8s - about 25s of virtual
               time. `acked` is the other long one, where every module waits
               out its own eight-second ceiling. Chrome runs all of this on a
               virtual clock, so the wait costs no real time; the
               --virtual-time-budget the test hands Chrome has to cover it. */
            await new Promise((done) => setTimeout(done, 45000));

            const report = {
                scenario: window.SCENARIO,
                maxConcurrentFetches: window.maxConcurrentFetches,
                fetches: window.fetchLog.length,
                /* Only the first request of each module - four spans, which
                   is what both the overlap and its absence are made of. */
                spans: window.fetchLog.slice(0, ASKERS.length)
                    .map((entry) => `${entry.startedAt}-${entry.endedAt}`),
                turns: Object.fromEntries(ASKERS.map((id) => [id, firstTurn(id)])),
                lastTurns: Object.fromEntries(ASKERS.map((id) => [id, lastTurn(id)]))
            };

            try {
                assert(window.pageErrors.length === 0,
                    `a module threw: ${window.pageErrors.join(' | ')}`);

                assert(window.fetchLog.length > 0, 'no module fetched anything at all');

                for (const moduleId of ASKERS) {
                    const turn = report.turns[moduleId];
                    assert(turn, `${moduleId} never asked for a turn`);
                    assert(turn.released !== null,
                        `${moduleId} asked for a turn and never finished with it - it is starved`);
                }

                if (window.SCENARIO === 'none' || window.SCENARIO === 'silent' || window.SCENARIO === 'old') {
                    /* THE PATH THAT SILENTLY BREAKS EVERYTHING. Nothing
                       answers, so every module has to fall through to its own
                       timer. The ceiling below is the answer window plus the
                       stubbed request; anything past it means a module is
                       waiting on a reply that is never coming. Spelling out
                       FETCH_MS rather than folding it into a round number is
                       what keeps this exactly as tight when the stub's length
                       moves - it was `SLOT_ANSWER_MS + 1000` against a 300ms
                       stub, which is this same number. */
                    for (const moduleId of ASKERS) {
                        const turn = report.turns[moduleId];
                        assert(turn.cost <= SLOT_ANSWER_MS + FETCH_MS + TURN_SLACK_MS,
                            `${moduleId} waited ${turn.cost}ms on a Manager that never answered`);
                    }

                    /* And only once. "Proceeds immediately with no wait" is
                       the acceptance criterion, and a module that paid the
                       answer window on every request would turn a room
                       discovery pass into a minute and a half of nothing. A
                       repeat request may cost the stubbed request and nothing
                       else; paying the answer window again would cost
                       SLOT_ANSWER_MS more than this allows. */
                    for (const moduleId of ASKERS) {
                        const turn = report.lastTurns[moduleId];
                        if (turn.asks < 2) continue;
                        assert(turn.cost !== null && turn.cost < FETCH_MS + TURN_SLACK_MS,
                            `${moduleId} paid the answer window again on request ${turn.asks}`
                            + ` (${turn.cost}ms), so a page with no Manager pays it every time`);
                    }
                }

                if (window.SCENARIO === 'acked') {
                    /* A Manager that said "wait" and then died. The modules
                       wait longer, because being acknowledged is worth waiting
                       for - and then go anyway, on their own ceiling. */
                    for (const moduleId of ASKERS) {
                        const turn = report.turns[moduleId];
                        assert(turn.cost > SLOT_ANSWER_MS,
                            `${moduleId} ignored the acknowledgement and went at ${turn.cost}ms`);
                        assert(turn.cost <= SLOT_MAX_WAIT_MS + FETCH_MS + TURN_SLACK_MS,
                            `${moduleId} waited ${turn.cost}ms on a Manager that never came back`);
                    }
                }

                if (window.SCENARIO === 'real') {
                    /* The acceptance criterion: with a Manager present, the
                       modules take turns instead of firing together.

                       Shown to fail when the broker stops brokering: with the
                       Manager's SLOT_CONCURRENCY raised from 1 to 9 and
                       nothing else touched, this went red three times out of
                       three at 4 overlapping requests. The same mutation
                       against the old 300ms stub was caught at 2 - by the one
                       pair of modules that load back to back, which is the
                       same fragile pair the control below was relying on. So
                       FETCH_MS is not only the control's window: it is this
                       assertion's sensitivity too, and that is why both arms
                       use the one constant rather than the brokered run
                       keeping a short stub of its own. */
                    assert(window.maxConcurrentFetches === 1,
                        `${window.maxConcurrentFetches} background requests overlapped with the broker running`);
                }

                if (window.SCENARIO === 'silent') {
                    /* And the proof that the line above is worth asserting:
                       without a broker these same four modules do collide.
                       The same stub, the same FETCH_MS and the same four
                       modules as `real` - the only difference is the broker,
                       which is what makes the pair a comparison rather than
                       two separate measurements.

                       This is the one assertion here that can only be made
                       true by widening a window rather than by naming a
                       constant, so FETCH_MS carries the reasoning for how
                       wide, and the report carries the four fetch spans so a
                       failure says how far apart they landed instead of only
                       that they did. */
                    assert(window.maxConcurrentFetches > 1,
                        'nothing overlapped even without a broker, so the serialisation check proves nothing');
                }

                output.dataset.testResult = 'pass';
                output.textContent = `PASS ${JSON.stringify(report)}`;
            } catch (error) {
                output.dataset.testResult = 'fail';
                output.textContent = `FAIL: ${error.message} ${JSON.stringify(report)}`;
            }
        });
    </script>
</body>
