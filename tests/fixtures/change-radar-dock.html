<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Lectio Change Radar dock fixture</title>
    <script>
        const catalogue = {
            schemaVersion: 1,
            generatedAt: '2026-09-20T00:00:00.000Z',
            modules: [{
                id: 'change-radar',
                name: 'Lectio Change Radar',
                version: '0.4.0',
                description: 'Test radar',
                status: 'unstable',
                installUrl: 'https://raw.githubusercontent.com/RktRobinhood/Lectio-Scripts/main/modules/Lectio-Change-Radar.user.js'
            }]
        };
        const storage = new Map([
            ['lectioManager.catalogue.v1', JSON.stringify(catalogue)],
            ['lectioManager.lastRefresh.v1', Date.now()],
            ['lectioManager.updateTipDismissed.v1', true]
        ]);

        window.GM_getValue = (key, fallback) => storage.has(key) ? storage.get(key) : fallback;
        window.GM_setValue = (key, value) => storage.set(key, value);
        window.GM_xmlhttpRequest = () => {};
        window.fetch = async (url) => ({
            ok: true,
            status: 200,
            url: String(url),
            text: async () => '<!doctype html><html><body></body></html>'
        });

        window.registrations = new Map();
        window.addEventListener('lectio-module:register', (event) => {
            window.registrations.set(event.detail.id, event.detail);
        });

        // A settings record exactly as 0.3.0 left it: 'floating' was that
        // version's default, written out for everyone, and with no schema
        // marker. A stored value beats a changed default, so without a one-time
        // migration the 0.4.0 dock default would never reach an existing
        // install - which is precisely what happened in the field.
        // The fixture is served from /lectio/223/ and carries no laererid or
        // elevid, so the module scopes its storage to school 223, current-user.
        window.radarSettingsKey = 'lectioChangeRadar.v1.223.current-user.settings';
        localStorage.setItem(window.radarSettingsKey, JSON.stringify({
            displayMode: 'floating',
            pollMinutes: 10,
            weeksAhead: 1
        }));
    </script>
    <script src="/manager/Lectio-Manager.user.js"></script>
    <script src="/modules/Lectio-Change-Radar.user.js"></script>
</head>
<body>
    <main id="masterContent">Lectio fixture</main>
    <script>
        const assert = (condition, message) => {
            if (!condition) throw new Error(message);
        };

        window.addEventListener('load', () => {
            const result = document.createElement('pre');
            result.id = 'test-result';

            try {
                const registration = window.registrations.get('change-radar');
                assert(registration, 'Change Radar did not register with the Manager');
                assert(registration.settingsSchema.find((item) => item.key === 'displayMode')?.type === 'select', 'Radar location was not exposed as a select setting');
                assert(registration.settingsSchema.find((item) => item.key === 'hoverOpen')?.type === 'toggle', 'Radar toggle settings did not use the Manager schema');
                // The stored record says 'floating'; reaching automatic here is
                // the one-time migration off 0.3.0's persisted default.
                assert(registration.currentValues.displayMode === 'auto', `Radar location did not reach automatic: ${registration.currentValues.displayMode}`);

                const migrated = JSON.parse(localStorage.getItem(window.radarSettingsKey));
                assert(migrated.displayMode === 'auto', `the migration was not written back: ${migrated.displayMode}`);
                assert(migrated.schema === 2, 'the migrated record was not stamped with its schema, so it would migrate again');
                assert(migrated.pollMinutes === 10, 'the migration discarded an unrelated stored setting');

                // The Manager is installed on this page, so automatic mode puts
                // the radar in the shared dock rather than floating on the page.
                assert(!document.getElementById('lectio-change-radar'), 'Automatic mode left a floating radar on a page with the Manager');
                assert(document.querySelector('[data-dock-key="change-radar:radar"]'), 'Automatic mode did not place the radar in the dock');

                window.dispatchEvent(new CustomEvent('lectio-manager:set-setting', {
                    detail: { id: 'another-module', key: 'displayMode', value: 'floating' }
                }));
                assert(!document.getElementById('lectio-change-radar'), 'An unrelated module setting moved the radar');

                window.dispatchEvent(new CustomEvent('lectio-manager:set-setting', {
                    detail: { id: 'change-radar', key: 'displayMode', value: 'dock' }
                }));

                assert(!document.getElementById('lectio-change-radar'), 'The floating radar remained visible in dock mode');
                const dock = document.getElementById('lectio-manager-dock-root');
                const button = document.querySelector('[data-dock-key="change-radar:radar"]');
                assert(button && button.dataset.type === 'panel', 'Change Radar did not register a dock panel');
                assert(!dock.hidden, 'The dock stayed hidden after the radar registered');
                assert(button.querySelector('.lectio-manager-dock-icon svg'), 'The radar dock item had no icon');

                button.click();
                const panel = document.querySelector('.lectio-manager-dock-flyout-content #lectio-change-radar-panel');
                assert(panel?.classList.contains('is-dock-panel'), `The radar did not render inside the Manager flyout (${document.querySelector('.lectio-manager-dock-flyout-content')?.innerHTML || 'empty'})`);
                assert(!panel.querySelector('.lcr-pin'), 'The Manager-owned panel retained its floating pin control');

                window.dispatchEvent(new CustomEvent('lectio-manager:set-setting', {
                    detail: { id: 'change-radar', key: 'displayMode', value: 'floating' }
                }));
                assert(document.getElementById('lectio-change-radar'), 'The floating radar did not return');
                assert(!document.querySelector('[data-dock-key="change-radar:radar"]'), 'The radar dock item was not removed');
                assert(dock.hidden && dock.hasAttribute('inert'), 'The empty dock remained visible or interactive');

                // Going back to automatic returns the radar to the dock.
                window.dispatchEvent(new CustomEvent('lectio-manager:set-setting', {
                    detail: { id: 'change-radar', key: 'displayMode', value: 'auto' }
                }));
                assert(!document.getElementById('lectio-change-radar'), 'Automatic mode left the floating radar behind');
                assert(document.querySelector('[data-dock-key="change-radar:radar"]'), 'Automatic mode did not return the radar to the dock');

                /*
                 * The radar's dock text is bilingual, and it follows the
                 * Manager's language without the module listening for the
                 * change: both values go over as { en, da } and the Manager
                 * resolves them when it renders. It was English-only, which is
                 * half of issue #48.
                 */
                const radarTile = () => document.querySelector('[data-dock-key="change-radar:radar"]');
                const radarTip = () => document.getElementById(radarTile().getAttribute('aria-describedby'))?.textContent;

                assert(document.documentElement.dataset.lectioLanguage === 'en',
                    'Test setup: the Manager did not start in English');
                assert(radarTile().getAttribute('aria-label').startsWith('Lectio Change Radar'),
                    `The radar's dock label was not English: ${radarTile().getAttribute('aria-label')}`);
                const englishTip = radarTip();
                assert(englishTip, 'The radar dock item carried no accessible description at all');

                document.querySelector('#lectio-manager-toggle').click();
                const languageSelect = document.querySelector('.lectio-manager-language-select');
                languageSelect.value = 'da';
                languageSelect.dispatchEvent(new Event('change', { bubbles: true }));

                assert(radarTile().getAttribute('aria-label').startsWith('Lectio Ændringsradar'),
                    `The radar's dock label stayed English in Danish: ${radarTile().getAttribute('aria-label')}`);
                assert(radarTip() && radarTip() !== englishTip,
                    `The radar's dock tooltip stayed English in Danish: ${radarTip()}`);

                result.dataset.testResult = 'pass';
                result.textContent = 'PASS';
            } catch (error) {
                result.dataset.testResult = 'fail';
                result.textContent = `FAIL: ${error.message}`;
            }

            document.body.appendChild(result);
        });
    </script>
</body>
</html>
