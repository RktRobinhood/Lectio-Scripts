<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <title>Unit Copier fixture</title>
    <script>
        /* Issue #74: the planner. The shapes below are the real unit page's
           (studieplan/forloeb_vis.aspx, read 2026-10-07): lessons are
           div.ls-phase-activity#ACC<id> with their timetable block in the
           heading, items are article[data-to-toc-id^=ACH] under *_InlineHomework
           or *_InlineOther, the presentation is [data-to-toc-id^=ACP].

           Last year's unit, five lessons:
             ACC1 12/8   Calculators (homework), Scheme.pdf (homework, a file)
             ACC2 15/8   Slides (other content)
             ACC3 19/8   cancelled, nothing on it ..... takes no place
             ACC4 22/8   nothing on it .................. keeps its place
             ACC5 26/8   Quiz (homework), a presentation

           This year's timetable, days from today, three classes:
             HE700 "1i Math AA SL/2"  the new class - the right target
               +1 already has homework ................ left alone
               +2, +8, +9, +22, +23
               +3 cancelled ............................ ignored
               (nothing in the week of +15: a holiday)
             HE501 "2i MathAnSL/2"    last year's class, a year on - the
                                      unit is still attached to it, so it
                                      must not be the default
             HE900 "1i Psyc HL"       another course

           ?readonly=1 serves the page without Lectio's edit controls, as a
           unit someone else owns: no button may appear there. */
        window.READONLY = new URLSearchParams(location.search).has('readonly');

        const dayFromToday = (offset) => {
            const date = new Date();
            date.setHours(0, 0, 0, 0);
            date.setDate(date.getDate() + offset);
            return date;
        };

        const isoWeek = (date) => {
            const day = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const weekday = day.getUTCDay() || 7;
            day.setUTCDate(day.getUTCDate() + 4 - weekday);
            const yearStart = new Date(Date.UTC(day.getUTCFullYear(), 0, 1));
            return { week: Math.ceil(((day - yearStart) / 86400000 + 1) / 7), year: day.getUTCFullYear() };
        };

        const lectioDate = (date) => date.getDate() + '/' + (date.getMonth() + 1) + '-' + date.getFullYear();
        const isoDate = (date) => date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' +
            String(date.getDate()).padStart(2, '0');

        window.TARGETS = [
            { offset: 1, hold: 'HE700', name: '1i Math AA SL/2', absid: '7001', homework: true },
            { offset: 2, hold: 'HE700', name: '1i Math AA SL/2', absid: '7002' },
            { offset: 3, hold: 'HE700', name: '1i Math AA SL/2', absid: '7003', cancelled: true },
            { offset: 8, hold: 'HE700', name: '1i Math AA SL/2', absid: '7008' },
            { offset: 9, hold: 'HE700', name: '1i Math AA SL/2', absid: '7009' },
            { offset: 22, hold: 'HE700', name: '1i Math AA SL/2', absid: '7022' },
            { offset: 23, hold: 'HE700', name: '1i Math AA SL/2', absid: '7023' },
            { offset: 1, hold: 'HE501', name: '2i MathAnSL/2', absid: '5011' },
            { offset: 2, hold: 'HE501', name: '2i MathAnSL/2', absid: '5012' },
            { offset: 4, hold: 'HE501', name: '2i MathAnSL/2', absid: '5014' },
            { offset: 2, hold: 'HE900', name: '1i Psyc HL', absid: '9002' }
        ].map((lesson) => ({ ...lesson, date: dayFromToday(lesson.offset) }));

        const blockHtml = (lesson) =>
            '<a class="s2skemabrik s2bgbox s2brik' + (lesson.cancelled ? ' s2cancelled' : '') + '" ' +
            'href="/lectio/223/aktivitet/aktivitetforside2.aspx?absid=' + lesson.absid + '&amp;prevurl=SkemaNy.aspx" ' +
            'data-tooltip="' + (lesson.cancelled ? 'Aflyst!\n' : '') + lectioDate(lesson.date) + ' 10:55 til 12:05\n' +
            'Hold: ' + lesson.name + '\nLærer: MP\nLokale: 223A' +
            (lesson.homework ? '\n\nLektier:\n- Read chapter 1' : '') + '">' +
            '<div class="s2skemabrikcontent OnlyDesktop"><span data-lectiocontextcard="' + lesson.hold + '">' + lesson.name + '</span></div>' +
            '<div class="s2skemabrikcontent OnlyMobile"><span data-lectiocontextcard="' + lesson.hold + '">' + lesson.name + '</span></div>' +
            '</a>';

        const weekHtml = (week, year) => {
            const lessons = TARGETS.filter((lesson) => {
                const at = isoWeek(lesson.date);
                return at.week === week && at.year === year;
            });

            return '<!doctype html><html><body><table><tr class="s2dayHeader"><td>Uge</td></tr><tr>' +
                lessons.map((lesson) => '<td data-date="' + isoDate(lesson.date) + '">' + blockHtml(lesson) + '</td>').join('') +
                '<td data-date="x"></td></tr></table></body></html>';
        };

        window.requests = [];

        window.fetch = (url, init) => {
            const parsed = new URL(String(url), location.href);
            window.requests.push({ path: parsed.pathname, search: parsed.search, method: (init && init.method) || 'GET' });

            if (parsed.pathname === '/lectio/223/SkemaNy.aspx' && !parsed.searchParams.get('type')) {
                const param = parsed.searchParams.get('week') || '';
                const html = weekHtml(Number(param.slice(0, 2)), Number(param.slice(2)));
                return Promise.resolve(new Response(html, { status: 200, headers: { 'content-type': 'text/html' } }));
            }

            return Promise.reject(new TypeError('unexpected request ' + url));
        };

        sessionStorage.clear();
    </script>
</head>
<body>
    <div id="masterContent">
        <div id="buttons">
            <div class="buttontext"><a href="#" data-role="button" id="m_Content_Visning_newfrombtn"><span class="ls-fonticon">content_copy</span>Kopiér forløb</a></div>
        </div>

        <div class="ls-phase-activity" id="overview">
            <div data-to-toc-id="overview" class="ls-paper-section-heading ls-section-title-heading">Forløb - Unit 1: Algebra &amp; Functions</div>
            <table><tr id="m_Content_Visning_forloebOversigtControl2_tocAndToolbar_HoldRow"><th>Hold:</th><td>
                <span data-lectiocontextcard="HE500">2025/26: 1i MathAnSL/2</span><br>
                <span data-lectiocontextcard="HE501">2026/27: 2i MathAnSL/2</span>
            </td></tr></table>
        </div>

        <div id="m_Content_Visning_forloebOversigtControl2_tocAndToolbar_actContainer"></div>
    </div>

    <script>
        if (!window.READONLY) {
            document.getElementById('buttons').insertAdjacentHTML('beforeend',
                '<div class="buttontext"><a href="#" data-role="button" id="m_Content_Visning_editbtn">Rediger forløb</a></div>');
        }

        const SOURCE = [
            { acc: 'ACC1', when: '12/8-2025 11:00 til 12:10', items: [['ACH11', 'homework', 'Calculators', ''], ['ACH12', 'homework', 'Scheme.pdf', 'file']] },
            { acc: 'ACC2', when: '15/8-2025 09:40 til 10:50', items: [['ACH21', 'other', 'Slides', '']] },
            { acc: 'ACC3', when: '19/8-2025 09:40 til 10:50', cancelled: true, items: [] },
            { acc: 'ACC4', when: '22/8-2025 09:40 til 10:50', items: [] },
            { acc: 'ACC5', when: '26/8-2025 12:35 til 13:45', items: [['ACH51', 'homework', 'Quiz', 'link'], ['ACP52', 'presentation', 'Unit 1 slides', '']] }
        ];

        document.querySelector('[id$="_actContainer"]').innerHTML = SOURCE.map((lesson, index) => {
            const prefix = 'm_Content_Visning_forloebOversigtControl2_tocAndToolbar_ActivitiesRep_ctl0' + index + '_Activity_';
            const article = ([id, , title, linkType]) =>
                '<article class="lc-display-fragment ls-acr-display" data-to-toc-id="' + id + '"><h1>' +
                (linkType ? '<a href="#" data-lc-display-linktype="' + linkType + '">' + title + '</a>' : title) +
                '</h1><p>Text</p></article><a id="' + id + '"></a>';
            const of = (kind) => lesson.items.filter((item) => item[1] === kind);

            return '<div class="ls-phase-activity" id="' + lesson.acc + '"><div class="ls-phase-activity-title">' +
                '<div data-to-toc-id="' + lesson.acc + '" class="ls-section-title-heading">' +
                '<a class="s2skemabrik s2normal s2brik' + (lesson.cancelled ? ' s2cancelled' : '') + '" data-brikid="ABS' + (index + 1) + '" ' +
                'href="#" data-tooltip="' + (lesson.cancelled ? 'Aflyst!\n' : '') + lesson.when + '\nHold: 1i MathAnSL/2\nLokale: 223A">' +
                '<span data-lectiocontextcard="HE500">1i MathAnSL/2</span></a></div></div>' +
                '<div class="ls-phase-activity-content">' +
                (of('homework').length ? '<div id="' + prefix + 'InlineHomework"><div>Lektier</div>' + of('homework').map(article).join('') + '</div>' : '') +
                (of('other').length ? '<div id="' + prefix + 'InlineOther"><div>Øvrigt indhold</div>' + of('other').map(article).join('') + '</div>' : '') +
                (of('presentation').length ? '<div id="' + prefix + 'InlinePresentation">' + of('presentation').map(article).join('') + '</div>' : '') +
                (lesson.items.length ? '' : '<div id="' + prefix + 'emptyList"></div>') +
                '</div></div>';
        }).join('');
    </script>

    <script src="/unit-copier.user.js"></script>

    <script>
        const failures = [];
        const assert = (condition, message) => { if (!condition) failures.push(message); };
        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        const waitFor = async (predicate, label) => {
            for (let attempt = 0; attempt < 600; attempt += 1) {
                if (predicate()) return true;
                await wait(50);
            }
            failures.push('timed out waiting for ' + label);
            return false;
        };
        const report = () => {
            const output = document.createElement('pre');
            output.id = 'test-result';
            output.textContent = failures.length ? failures.join(' | ') : 'pass';
            document.body.dataset.testResult = failures.length ? 'fail' : 'pass';
            document.body.appendChild(output);
        };

        const overlay = () => document.getElementById('lectio-unit-copier');
        const rows = () => [...overlay().querySelectorAll('.luc-row')];
        const rowFor = (absid) => overlay().querySelector('.luc-row[data-target="' + absid + '"]');
        const sourceCard = (index) => overlay().querySelector('.luc-card[data-lesson="' + index + '"]');
        const buttonIn = (node, label) => [...node.querySelectorAll('button')].find((b) => b.textContent === label);
        // What lands on a target, read as last year's date ("12/8"), or a state.
        const landing = (absid) => {
            const row = rowFor(absid);
            if (!row) return 'missing';
            if (row.dataset.state !== 'filled') return row.dataset.state;
            return (row.textContent.match(/← \S+ (\d+\/\d+)/) || [])[1] || 'unreadable';
        };
        const plan = () => rows().map((row) => row.dataset.target + '=' + landing(row.dataset.target)).join(' ');

        (async () => {
            if (window.READONLY) {
                // An absence proof: give the module time to have added it.
                await new Promise((resolve) => (document.readyState === 'loading'
                    ? document.addEventListener('DOMContentLoaded', resolve, { once: true }) : resolve()));
                await wait(300);
                assert(!document.getElementById('lectio-unit-copier-open'), 'the button appeared on a unit the person cannot edit');
                assert(window.requests.length === 0, 'a read-only unit page fetched something: ' + window.requests.length);
                return;
            }

            // Served this way the module is parsed with the page and starts on
            // DOMContentLoaded; Tampermonkey injects it after load instead.
            await waitFor(() => document.querySelector('#lectio-unit-copier-open a'), 'the button');
            const open = document.querySelector('#lectio-unit-copier-open a');
            assert(open, 'no "copy into a class" button beside Kopiér forløb');
            if (!open) return;
            assert(open.textContent.includes('Kopiér ind i et hold'), 'the button is not in Danish on a Danish page: ' + open.textContent);
            assert(open.closest('.buttontext').previousSibling.nodeType === Node.TEXT_NODE &&
                document.getElementById('m_Content_Visning_newfrombtn').closest('.buttontext').nextSibling.nextSibling === open.closest('.buttontext'),
                'the button is not placed right after Kopiér forløb');

            open.click();
            await waitFor(() => overlay() && overlay().querySelector('select option[value="HE700"]'), 'the class list');

            const select = overlay().querySelector('select');
            assert(select.value === 'HE700', 'the default class is ' + select.value + ', expected the new 1i Math AA SL/2 (HE700)');
            assert([...select.options].map((o) => o.value).pop() === 'HE501',
                'the class the unit already belongs to is not ranked last: ' + [...select.options].map((o) => o.value).join(','));

            /* Last year's sequence: the cancelled empty lesson takes no place. */
            const cards = [...overlay().querySelectorAll('.luc-card[data-lesson]')];
            assert(cards.length === 4, 'expected 4 lessons from last year, got ' + cards.length);
            assert(cards.every((card) => !card.textContent.includes('19/8')), 'the cancelled empty lesson was kept');
            assert(cards[0].querySelectorAll('.luc-item').length === 2 && cards[1].querySelector('.luc-item[data-kind="other"]'),
                'items or their kinds were not read');
            assert(cards[3].querySelector('.luc-item[data-kind="presentation"]'), 'the presentation was not read');

            buttonIn(overlay(), 'Find lektioner').click();
            await waitFor(() => rows().length && !buttonIn(overlay(), 'Find lektioner').disabled, 'the scan to finish');

            /* In order, skipping the lesson that already has homework and the
               cancelled one, and across the holiday week. */
            assert(plan() === '7001=skipped 7002=12/8 7008=15/8 7009=22/8 7022=26/8 7023=empty',
                'default plan: ' + plan());
            assert(!rowFor('7003'), 'the cancelled lesson is in the plan');
            const summary = overlay().querySelector('.luc-summary').textContent;
            assert(/4 lektioner fra sidste år på 4 af dine lektioner/.test(summary) && /1 af dine lektioner har allerede materiale/.test(summary) &&
                /1 aflyste/.test(summary), 'summary: ' + summary);

            /* Leave a lesson empty: everything after it moves along one. */
            buttonIn(rowFor('7002'), 'Lad stå tom').click();
            assert(plan() === '7001=skipped 7002=skipped 7008=12/8 7009=15/8 7022=22/8 7023=26/8', 'after leaving 7002 empty: ' + plan());

            /* Leave an old lesson out: it is not placed, and the rest close up. */
            buttonIn(sourceCard(1), 'Udelad').click();
            assert(plan() === '7001=skipped 7002=skipped 7008=12/8 7009=22/8 7022=26/8 7023=empty', 'after leaving 15/8 out: ' + plan());

            /* Drag: last year's 26/8 (index 3 in the sequence, after the cancelled
               lesson dropped out) onto 7002. 7002 comes back into use, and
               26/8 starts the sequence there. */
            const transfer = new DataTransfer();
            sourceCard(3).dispatchEvent(new DragEvent('dragstart', { dataTransfer: transfer, bubbles: true }));
            rowFor('7002').dispatchEvent(new DragEvent('dragover', { dataTransfer: transfer, bubbles: true, cancelable: true }));
            rowFor('7002').dispatchEvent(new DragEvent('drop', { dataTransfer: transfer, bubbles: true, cancelable: true }));
            assert(plan() === '7001=skipped 7002=26/8 7008=12/8 7009=22/8 7022=empty 7023=empty', 'after dragging 26/8 onto 7002: ' + plan());

            /* The Manager switching to English rewords it in place. */
            document.documentElement.dataset.lectioLanguage = 'en';
            window.dispatchEvent(new CustomEvent('lectio-manager:language', { detail: { language: 'en' } }));
            assert(overlay().querySelector('h2').textContent === 'Copy this unit into a class', 'title after switching to English: ' + overlay().querySelector('h2').textContent);
            assert(document.querySelector('#lectio-unit-copier-open a').textContent.includes('Copy into a class'), 'the button did not switch to English');
            assert(plan() === '7001=skipped 7002=26/8 7008=12/8 7009=22/8 7022=empty 7023=empty', 'switching language changed the plan: ' + plan());

            /* It only ever read: GETs of the person's own timetable, nothing else. */
            assert(window.requests.length > 0 && window.requests.every((r) => r.method === 'GET' && r.path === '/lectio/223/SkemaNy.aspx' && /^\?week=\d{6}&showtype=0$/.test(r.search)),
                'a request other than a timetable GET: ' + JSON.stringify(window.requests.find((r) => r.method !== 'GET' || r.path !== '/lectio/223/SkemaNy.aspx')));

            /* Escape closes it, and the draft survives for this tab. */
            document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
            assert(!overlay(), 'Escape did not close the planner');
            const draft = JSON.parse(sessionStorage.getItem('lectioUnitCopier.draft.') || 'null');
            assert(draft && draft.holdId === 'HE700' && draft.leftOut.includes(1), 'the draft was not kept for this tab: ' + JSON.stringify(draft));
            assert(Object.keys(localStorage).every((key) => !/unitcopier/i.test(key)), 'the planner wrote to localStorage');
        })()
            .catch((error) => failures.push('threw: ' + (error && error.stack || error)))
            .finally(report);
    </script>
</body>
</html>
