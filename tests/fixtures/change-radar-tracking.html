<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Lectio Change Radar tracking fixture</title>
    <script>
        // A controllable clock, installed before the module loads. The extra
        // sources deliberately run on a 30-minute cadence, so the only way to
        // exercise them in a test is to move time forward rather than to add a
        // test-only seam to the module itself.
        const realNow = Date.now;
        let clockOffset = 0;
        Date.now = () => realNow.call(Date) + clockOffset;

        // Round 0 is the baseline every later round is compared against.
        let round = 0;

        // What the module tells the Manager's problem log, if one were here.
        window.reports = [];
        window.addEventListener('lectio-module:report', (event) => {
            window.reports.push(event.detail || {});
        });

        const lesson = (room, homework) => {
            const tooltip = [
                'Matematik A',
                '20/10-2030 08:00 til 09:30',
                'Hold: 3a MA',
                'Lærer: MP',
                'Lokaler: ' + room,
                'Lektier: ' + homework
            ].join('\n');

            return '<!doctype html><html><body><table><tr><td>' +
                '<a class="s2skemabrik s2brik s2normal" href="/lectio/223/aktivitet/aktivitetforside2.aspx?absid=900001" ' +
                'data-tooltip="' + tooltip + '"><span class="s2skemabrikcontent">Matematik A</span></a>' +
                '</td></tr></table></body></html>';
        };

        // The real OpgaveListe links its rows with exeid= (issue #59, read off
        // tests/fixtures/pages/opgaveliste.html); exerciseid= was the guess
        // before that page was seen and is still accepted, so one row here
        // keeps that shape. The table names its columns the way the real one
        // does, so the deadline is read from Frist rather than from the note
        // beside it - which carries a date of its own on purpose - and the
        // grade only from Karakter.
        const assignmentLink = (id, legacy) => legacy
            ? '/lectio/223/ElevAflevering.aspx?exerciseid=' + id + '&amp;elevid=1'
            : '/lectio/223/fravaer_indtastskriftlig.aspx?exeid=' + id + '&amp;prevurl=OpgaveListe.aspx';

        const assignmentHeader =
            '<tr><th>Uge</th><th>Hold</th><th>Opgavetitel</th><th>Opgavenote</th><th>Frist</th>' +
            '<th>Status</th><th>Karakter</th></tr>';

        const assignmentRow = ({ id, title, due, status, note = '', grade = '', legacy = false }) =>
            '<tr><td>40</td><td>3a DA</td>' +
            '<td><a href="' + assignmentLink(id, legacy) + '">' + title + '</a></td>' +
            '<td>' + note + '</td><td>' + due + '</td><td>' + status + '</td><td>' + grade + '</td></tr>';

        const pad2 = (value) => String(value).padStart(2, '0');
        const addDays = (date, days) => {
            const copy = new Date(date);
            copy.setDate(copy.getDate() + days);
            return copy;
        };
        const startOfIsoWeek = (date) => {
            const copy = new Date(date);
            copy.setDate(copy.getDate() - ((copy.getDay() + 6) % 7));
            copy.setHours(0, 0, 0, 0);
            return copy;
        };
        const lectioDate = (date) => date.getDate() + '/' + (date.getMonth() + 1) + '-' + date.getFullYear();

        window.isoDate = (date) => date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());

        // 17 days past the start of this ISO week: always beyond a one-week
        // lookahead and always inside a three-week one, whichever day the suite
        // runs on. Its deadline never moves, so the only thing that can put it
        // on the radar is the watched window widening to reach it.
        window.horizonProbe = addDays(startOfIsoWeek(new Date()), 17);

        const assignments = () => {
            // The drift round: the list is plainly the list - headed, with a
            // data row - but its links carry neither key the parser knows.
            if (round >= 7) {
                return '<!doctype html><html><body><table>' + assignmentHeader +
                    '<tr><td>40</td><td>3a DA</td>' +
                    '<td><a href="/lectio/223/ElevAflevering.aspx?assignment=101">Essay 1</a></td>' +
                    '<td></td><td>1/10-2030 23:59</td><td>Ikke afleveret</td><td></td></tr>' +
                    '</table></body></html>';
            }

            const probe = assignmentRow({
                id: 103, title: 'Rapport', due: lectioDate(window.horizonProbe) + ' 23:59', status: 'Ikke afleveret'
            });
            const essay1 = (due) => assignmentRow({
                id: 101, title: 'Essay 1', due, status: 'Ikke afleveret', note: 'Se planen fra 1/1-2030', grade: '7'
            });
            const rows = round === 0
                ? essay1('01/10-2030 23:59') + probe
                : essay1('05/10-2030 23:59') +
                  assignmentRow({ id: 102, title: 'Essay 2', due: '12/10-2030 23:59', status: 'Ikke afleveret', legacy: true }) +
                  probe;

            return '<!doctype html><html><body><table>' + assignmentHeader + rows + '</table></body></html>';
        };

        // The absence page a student sees, which is the one the percentage
        // half of the parser is written for: registrations linked the way the
        // real teacher page links them (ActivityAbsenceRegistration.aspx?id=,
        // issue #59), one in the older absenseId= shape, and a per-hold
        // percentage row. A bare id= on some other page must not be read as a
        // registration, which is what the drift round checks.
        const absenceLink = (id, legacy) => legacy
            ? '/lectio/223/fravaer_elev.aspx?absenseId=' + id
            : '/lectio/223/ActivityAbsenceRegistration.aspx?id=' + id + '&amp;prevurl=subnav%2ffravaerelev.aspx';

        const absenceRow = (id, title, legacy = false) =>
            '<tr><td>40</td><td><a href="' + absenceLink(id, legacy) + '">' + title + '</a></td><td>3a MA</td></tr>';

        const percentRow = (percent) =>
            '<tr><td><span data-lectiocontextcard="HE9000001">3a MA</span></td><td>' + percent + '</td></tr>';

        const absence = () => {
            if (round >= 7) {
                return '<!doctype html><html><body><table><tr><th>Uge</th><th>Aktivitet</th><th></th></tr>' +
                    '<tr><td>40</td><td><a class="s2skemabrik s2normal" data-tooltip="1/10-2030 08:00 til 09:30\nHold: 3a MA">' +
                    '<span class="s2skemabrikcontent">3a MA</span></a></td>' +
                    '<td><a href="/lectio/223/somewhere_else.aspx?id=9">Angiv fravær</a></td></tr>' +
                    '</table></body></html>';
            }

            const rows = absenceRow(201, 'Fravær 1/10') +
                absenceRow(202, 'Fravær 2/10', true) +
                (round >= 6 ? absenceRow(203, 'Fravær 3/10') : '') +
                percentRow(round >= 6 ? '3,1%' : '2,5%');

            return '<!doctype html><html><body><table>' + rows + '</table></body></html>';
        };

        const schedule = () => {
            if (round === 0) return lesson('A12', 'Read chapter 1');
            if (round === 1) return lesson('A12', 'Read chapter 2');
            return lesson('B07', 'Read chapter 2');
        };

        window.fetchLog = [];
        window.fetch = async (url) => {
            const text = String(url);
            window.fetchLog.push(text);

            let body = '<!doctype html><html><body></body></html>';
            if (/SkemaNy\.aspx/i.test(text)) body = schedule();
            else if (/OpgaveListe\.aspx/i.test(text)) body = assignments();
            else if (/fravaer(?:elev|laerer)\.aspx/i.test(text)) body = absence();

            return { ok: true, status: 200, url: text, text: async () => body };
        };

        // No Manager in this fixture, so the radar falls back to its floating
        // HUD. Only the watched weeks are narrowed, so one schedule request per
        // check keeps the rounds unambiguous.
        localStorage.setItem('lectioChangeRadar.v1.223.current-user.settings', JSON.stringify({
            displayMode: 'floating',
            pollMinutes: 30,
            weeksAhead: 0
        }));
    </script>
    <script src="/modules/Lectio-Change-Radar.user.js"></script>
</head>
<body>
    <main id="masterContent">Lectio fixture</main>
    <script>
        const failures = [];
        const assert = (condition, message) => {
            if (!condition) failures.push(message);
        };

        const STATE_KEY = 'lectioChangeRadar.v1.223.current-user.state';
        const readHistory = () => {
            try {
                return JSON.parse(localStorage.getItem(STATE_KEY) || '{}').history || [];
            } catch (_) {
                return [];
            }
        };

        const readSnapshot = () => {
            try {
                return JSON.parse(localStorage.getItem(STATE_KEY) || '{}').snapshot || null;
            } catch (_) {
                return null;
            }
        };

        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        // A wait that runs out stops the run: every later round is compared
        // against the one that never arrived, and would only spend the page's
        // time budget on failures that say nothing new.
        const waitFor = async (predicate, label) => {
            for (let attempt = 0; attempt < 120; attempt += 1) {
                if (predicate()) return true;
                await wait(50);
            }
            throw new Error('timed out waiting for ' + label);
        };

        const finish = () => {
            const output = document.createElement('pre');
            output.id = 'test-result';
            output.textContent = failures.length ? failures.join(' | ') : 'pass';
            document.body.dataset.testResult = failures.length ? 'fail' : 'pass';
            document.body.appendChild(output);
        };

        // Changing any tracker re-checks on a 600ms debounce, so setting the
        // trackers for a round is also what drives that round's check.
        const setTrackers = (values) => {
            window.dispatchEvent(new CustomEvent('lectio-manager:set-setting', {
                detail: { moduleId: 'change-radar', values }
            }));
        };

        const kinds = () => readHistory().map((item) => item.kind);
        const sourceRecords = (key) => (readSnapshot()?.sources?.[key]?.records) || {};
        const reportCodes = () => window.reports.map((report) => report.kind + ':' + report.code);

        (async () => {
            // --- Round 0: baseline.
            await waitFor(() => readSnapshot(), 'the first snapshot');

            const baseline = readSnapshot();
            assert(Object.keys(baseline?.events || {}).length === 1, 'baseline should hold one lesson');
            assert(readHistory().length === 0, 'a first snapshot is a baseline, not a change log');
            assert(
                Boolean(baseline?.sources?.assignments),
                'assignments are tracked by default, so the baseline should carry them'
            );
            assert(
                Object.keys(baseline?.sources?.assignments?.records || {}).length === 2,
                'the baseline assignment list should hold both assignments'
            );
            assert(
                !baseline?.sources?.absence && !baseline?.sources?.documents,
                'absence and documents are off by default and must not be fetched'
            );
            assert(
                !window.fetchLog.some((url) => /fravaer|DokumentOversigt/i.test(url)),
                'no request should be made for a source that is switched off'
            );

            // The named columns, read as named: the deadline is the Frist
            // cell and not the date in the note beside it, and the grade is
            // the Karakter cell.
            const essay1 = baseline?.sources?.assignments?.records?.EX101;
            assert(
                essay1?.dueDate === '2030-10-01' && essay1?.dueTime === '23:59',
                'Essay 1 should take its deadline from the Frist column, not the note, got: ' +
                    essay1?.dueDate + ' ' + essay1?.dueTime
            );
            assert(
                essay1?.status === 'Ikke afleveret · Grade 7',
                'Essay 1 should carry its status word and the Karakter cell as a grade, got: ' + essay1?.status
            );
            assert(
                !/1\/1-2030/.test(essay1?.context || '') && /3a DA/.test(essay1?.context || ''),
                'the context should carry the hold and not the note\'s date, got: ' + essay1?.context
            );

            // --- Round 1: homework moves while room tracking is switched off.
            round = 1;
            setTrackers({ trackRoomChanges: false });
            await waitFor(() => kinds().includes('homework'), 'the homework change');

            assert(
                !kinds().includes('room'),
                'room changes must not be reported while that tracker is off'
            );

            const homeworkEntry = readHistory().find((item) => item.kind === 'homework');
            assert(
                /chapter 2/i.test(homeworkEntry?.detail || ''),
                'a homework entry should quote the new homework, got: ' + homeworkEntry?.detail
            );

            // --- Round 2: the room moves too, with room tracking back on.
            round = 2;
            setTrackers({ trackRoomChanges: true });
            await waitFor(() => kinds().includes('room'), 'the room change');

            const roomEntry = readHistory().find((item) => item.kind === 'room');
            assert(
                /A12/.test(roomEntry?.detail || '') && /B07/.test(roomEntry?.detail || ''),
                'a room entry should name both rooms, got: ' + roomEntry?.detail
            );

            // --- Round 3: past the extra-source cadence, the assignment list is
            // re-read and its own trackers apply.
            const assignmentRequests = window.fetchLog.filter((url) => /OpgaveListe/i.test(url)).length;
            assert(
                assignmentRequests === 1,
                'the assignment list should not be re-read inside its cadence, saw ' + assignmentRequests
            );

            // The value has to actually move for this to drive a re-check.
            // Assignment status does not change between rounds, so switching
            // its tracker on adds nothing to the log.
            clockOffset = 31 * 60 * 1000;
            setTrackers({ trackAssignmentStatus: true });
            await waitFor(() => kinds().includes('assignment'), 'the new assignment');

            assert(
                kinds().includes('deadline'),
                'a moved deadline should be reported'
            );

            const deadlineEntry = readHistory().find((item) => item.kind === 'deadline');
            assert(
                /Oct 1\b/.test(deadlineEntry?.detail || '') && /Oct 5\b/.test(deadlineEntry?.detail || ''),
                'a deadline entry should name both deadlines, got: ' + deadlineEntry?.detail
            );

            // Essay 2 is the row still linked the old way, exerciseid=; it is
            // the new assignment this round, so the legacy key is what found it.
            const newAssignment = readHistory().find((item) => item.kind === 'assignment');
            assert(
                newAssignment?.title === 'Essay 2',
                'the exerciseid= row should still be read as an assignment, got: ' + newAssignment?.title
            );
            assert(
                newAssignment?.eventDate === '2030-10-12',
                'an assignment should carry its deadline as the event date so the urgency window can use it, got: ' + newAssignment?.eventDate
            );

            // --- Round 4: the lookahead widens and a deadline that was beyond
            // it arrives on the radar, without the assignment itself changing.
            assert(
                !kinds().includes('due'),
                'a deadline outside the watched window should not be announced yet'
            );

            setTrackers({ weeksAhead: 2 });
            await waitFor(() => kinds().includes('due'), 'the deadline coming inside the window');

            const dueEntry = readHistory().find((item) => item.kind === 'due');
            assert(
                dueEntry?.eventDate === window.isoDate(window.horizonProbe),
                'a due-soon entry should carry its deadline, got: ' + dueEntry?.eventDate
            );
            assert(
                /3a DA/.test(dueEntry?.detail || ''),
                'a due-soon entry should carry what else the assignment page shows on the row, got: ' + dueEntry?.detail
            );
            assert(
                readHistory().filter((item) => item.kind === 'due').length === 1,
                'a deadline should announce itself once, not on every later check'
            );

            // --- Round 5: absence switched on. Its first read is a baseline:
            // both registration link shapes and the percentage row, no news.
            round = 5;
            clockOffset += 31 * 60 * 1000;
            setTrackers({ trackAbsence: true });
            await waitFor(() => Object.keys(sourceRecords('absence')).length > 0, 'the absence baseline');

            const absenceBaseline = sourceRecords('absence');
            assert(
                Object.keys(absenceBaseline).sort().join(',') === 'ABSENCE201,ABSENCE202,ABSPCTHE9000001',
                'the absence baseline should hold the ActivityAbsenceRegistration.aspx?id= row, the ' +
                    'absenseId= row and the percentage row, got: ' + Object.keys(absenceBaseline).sort().join(',')
            );
            assert(
                absenceBaseline.ABSENCE201?.type === 'registration' && absenceBaseline.ABSENCE201?.title === 'Fravær 1/10',
                'a registration should be titled by its link when the row has no lesson block, got: ' +
                    JSON.stringify(absenceBaseline.ABSENCE201)
            );
            assert(
                absenceBaseline.ABSPCTHE9000001?.type === 'percent' && absenceBaseline.ABSPCTHE9000001?.detail === '2,5%',
                'the percentage row should be keyed on its hold card, got: ' + JSON.stringify(absenceBaseline.ABSPCTHE9000001)
            );
            assert(
                !kinds().includes('absence'),
                'a first absence read is a baseline, not news'
            );

            // --- Round 6: a registration appears and the percentage moves,
            // with the percentage tracker switched on.
            round = 6;
            clockOffset += 31 * 60 * 1000;
            setTrackers({ trackAbsencePercent: true });
            await waitFor(() => kinds().includes('absence'), 'the absence news');

            const absenceEntries = readHistory().filter((item) => item.kind === 'absence');
            assert(
                absenceEntries.some((item) => item.title === 'Fravær 3/10' && /New absence registration/.test(item.detail || '')),
                'the new registration should be reported, got: ' + JSON.stringify(absenceEntries.map((item) => [item.title, item.detail]))
            );
            assert(
                absenceEntries.some((item) => /2,5% -> 3,1%/.test(item.detail || '')),
                'the moved percentage should be reported, got: ' + JSON.stringify(absenceEntries.map((item) => [item.title, item.detail]))
            );

            // --- Round 7: both list pages come back plainly themselves but
            // with no row the parsers recognise. That is not a quiet week: each
            // parser tells the Manager it looked and found nothing, and the
            // last good capture is kept rather than everything vanishing.
            assert(
                window.reports.length === 0,
                'nothing should have been reported while the pages parsed, got: ' + reportCodes().join(' ')
            );

            round = 7;
            clockOffset += 31 * 60 * 1000;
            setTrackers({ trackLessonNotes: true });
            await waitFor(
                () => reportCodes().includes('drift:assignment-rows') && reportCodes().includes('drift:absence-rows'),
                'both drift reports'
            );

            assert(
                window.reports.every((report) => report.moduleId === 'change-radar' && report.found === 0),
                'a drift report names the module and says it found nothing, got: ' + JSON.stringify(window.reports)
            );
            assert(
                Object.keys(sourceRecords('assignments')).length === 3,
                'a list that stopped parsing should keep its last good capture, got ' +
                    Object.keys(sourceRecords('assignments')).length + ' assignments'
            );
            assert(
                Object.keys(sourceRecords('absence')).length === 4,
                'an absence page that stopped parsing should keep its last good capture, got ' +
                    Object.keys(sourceRecords('absence')).length + ' records'
            );
            assert(
                !Object.keys(sourceRecords('absence')).includes('ABSENCE9'),
                'a bare id=9 on a page that is not ActivityAbsenceRegistration.aspx was read as a registration'
            );

            // --- Switching a source off must stop it being fetched at all.
            const beforeOff = window.fetchLog.filter((url) => /OpgaveListe/i.test(url)).length;
            clockOffset += 31 * 60 * 1000;
            setTrackers({ trackAssignments: false });
            await wait(1200);

            assert(
                window.fetchLog.filter((url) => /OpgaveListe/i.test(url)).length === beforeOff,
                'a source switched off must not be fetched again'
            );
            assert(
                !readSnapshot()?.sources?.assignments,
                'a source switched off should be dropped from the snapshot'
            );
        })().catch((error) => {
            failures.push(String((error && error.message) || error));
        }).then(finish);
    </script>
</body>
</html>
