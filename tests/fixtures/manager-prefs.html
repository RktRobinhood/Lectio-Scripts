<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Lectio Manager preferences fixture</title>
</head>
<body>
    <script>
        const catalogue = {
            schemaVersion: 1,
            generatedAt: '2026-09-19T00:00:00.000Z',
            modules: []
        };
        // A dock record written by the previous release: a single vertical
        // position, and the left edge taken for granted.
        const legacyDock = JSON.stringify({
            version: 1,
            order: ['test-module:only'],
            position: 'bottom',
            sizeMode: 'small',
            autoFit: false,
            autoHide: false
        });
        const storage = new Map([
            ['lectioManager.catalogue.v1', JSON.stringify(catalogue)],
            ['lectioManager.lastRefresh.v1', Date.now()],
            ['lectioManager.updateTipDismissed.v1', true],
            ['lectioManager.dock.v1', legacyDock],
            ['lectioManager.releaseChannel.v1', 'unstable']
        ]);

        window.GM_getValue = (key, fallback) => storage.has(key) ? storage.get(key) : fallback;
        window.GM_setValue = (key, value) => storage.set(key, value);
        // Record what the Manager asks GitHub for, so the channel switch below
        // can be checked for actually re-reading its channel rather than
        // answering out of the cache. Responds with the same catalogue so the
        // refresh completes instead of leaving the UI spinning.
        window.requestedUrls = [];
        window.GM_xmlhttpRequest = (options) => {
            window.requestedUrls.push(options.url);
            setTimeout(() => options.onload({
                status: 200,
                responseText: JSON.stringify(catalogue)
            }), 0);
        };
    </script>
    <script src="../../manager/Lectio-Manager.user.js"></script>
    <script>
        function assert(condition, message) {
            if (!condition) throw new Error(message);
        }

        // The Manager refreshes in the background as it boots, so a refresh the
        // user triggers may be queued behind it rather than fired on the spot.
        async function waitFor(condition, message, timeoutMs = 4000) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
                if (condition()) return;
                await new Promise(resolve => setTimeout(resolve, 25));
            }
            throw new Error(message);
        }

        window.addEventListener('load', async () => {
            try {
                const dock = document.querySelector('#lectio-manager-dock-root');
                window.dispatchEvent(new CustomEvent('lectio-manager:dock:register', {
                    detail: { moduleId: 'test-module', itemId: 'only', type: 'action', label: 'Only item' }
                }));

                assert(dock.dataset.edge === 'left', `Migrated dock left its edge unset: ${dock.dataset.edge}`);
                assert(dock.dataset.align === 'end', `Legacy position 'bottom' did not migrate to align 'end': ${dock.dataset.align}`);
                assert(dock.dataset.orientation === 'vertical', 'Migrated dock was not vertical');

                document.querySelector('#lectio-manager-toggle').click();
                document.querySelector('.lectio-manager-channel-btn').click();

                // The other migrated preferences survive the version bump.
                assert(document.querySelector('.lectio-manager-dock-size').value === 'small', 'Migration dropped the saved icon size');
                assert(document.querySelector('.lectio-manager-dock-fit').checked === false, 'Migration dropped the saved fit preference');
                assert(document.querySelector('.lectio-manager-dock-align').value === 'end', 'Migrated alignment did not reach its control');

                // Release channel is one row with a dropdown, not a radio group.
                assert(!document.querySelector('input[name="lectio-manager-channel"]'), 'Release channel still renders radio buttons');
                const channel = document.querySelector('.lectio-manager-channel-select');
                assert(channel.value === 'unstable', `Channel dropdown did not show the stored channel: ${channel.value}`);
                const note = document.querySelector('.lectio-manager-channel-note');
                assert(!note.hidden, 'The unstable caveat was hidden while the unstable channel was selected');

                /*
                 * The stable catalogue is cached above with a fresh timestamp,
                 * so a switch that respected the twenty-four hour interval would
                 * ask for nothing and keep showing the cached targets. That is
                 * what made a just-promoted module read as a downgrade, so the
                 * switch has to re-read the channel it switched to.
                 */
                window.requestedUrls.length = 0;
                channel.value = 'stable';
                channel.dispatchEvent(new Event('change', { bubbles: true }));
                assert(storage.get('lectioManager.releaseChannel.v1') === 'stable', 'Channel dropdown did not persist its choice');
                assert(note.hidden, 'The unstable caveat stayed visible on the stable channel');
                await waitFor(
                    () => window.requestedUrls.some(url => url.includes('/catalogue/modules.json')),
                    'Switching to Stable did not re-read the stable catalogue'
                );

                // "Release channel" explains itself on demand rather than taking
                // permanent space in the panel.
                const channelInfo = document.querySelector('.lectio-manager-channel-info');
                const channelHelp = document.querySelector('.lectio-manager-channel-help');
                assert(channelHelp.hidden, 'The channel explanation was showing before it was asked for');
                assert(channelInfo.getAttribute('aria-controls') === channelHelp.id, 'The channel info button is not wired to its explanation');
                channelInfo.click();
                assert(!channelHelp.hidden, 'The channel info button did not reveal its explanation');
                assert(channelInfo.getAttribute('aria-expanded') === 'true', 'The channel info button did not report itself expanded');
                channelInfo.click();
                assert(channelHelp.hidden, 'The channel info button did not hide its explanation again');

                // Alignment is named for the edge it runs along.
                const edge = document.querySelector('.lectio-manager-dock-edge');
                const align = document.querySelector('.lectio-manager-dock-align');
                assert(align.querySelector('option[value="start"]').textContent === 'Top', 'A left-edge dock did not label its alignment vertically');
                edge.value = 'top';
                edge.dispatchEvent(new Event('change', { bubbles: true }));
                assert(align.querySelector('option[value="start"]').textContent === 'Left', 'A top-edge dock did not relabel its alignment horizontally');
                assert(dock.dataset.orientation === 'horizontal', 'A top-edge dock did not turn into a row');

                document.documentElement.dataset.testResult = 'pass';
            } catch (error) {
                document.documentElement.dataset.testResult = `fail: ${error.message}`;
            }
        });
    </script>
</body>
</html>
